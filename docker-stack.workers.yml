  # ==========================================
  # WORKER MANAGER
  # ==========================================
  worker-manager:
    image: ${COMMUNITY_REGISTRY:-ghcr.io/industream}/flowmaker.infra/flowmaker-worker-manager:${WORKER_MANAGER_VERSION:-1.0.0}
    environment:
      - NODE_ENV=production
      - DATA_DIR=/data
      - BODY_SIZE_LIMIT=500M
      - DOCKER_NETWORK=${STACK_NAME:-industream-${ENV}}_${ENV}-platform
      - SCHEDULER_SERVICE=${STACK_NAME:-industream-${ENV}}_flowmaker-scheduler
      - LOGGING_SERVICE=${STACK_NAME:-industream-${ENV}}_flowmaker-logging
      - HUB_BACKEND_URL=http://industream-hub-backend:3050
      - HUB_AUTH_ISSUER=${HUB_AUTH_ISSUER:-hub-backend}
      - HUB_AUTH_AUDIENCE=${HUB_AUTH_AUDIENCE:-industream-hub}
    volumes:
      # Mount the docker socket read-only. Worker-manager only inspects
      # container/service state to report worker status. Any container
      # lifecycle action (start/stop/restart) must be routed through a
      # privileged control-plane API — granting RW here turns an auth bypass
      # in this web-exposed service into full root on the Swarm manager.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ${ENV}-worker-manager-data:/data
    networks:
      - traefik-public
      - ${ENV}-platform
    depends_on:
      - flowmaker-scheduler
      - flowmaker-logging
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      labels:
        - traefik.enable=true
        - traefik.http.routers.${ENV}-worker-manager-secure.entrypoints=websecure
        - traefik.http.routers.${ENV}-worker-manager-secure.rule=Host(`workers.${INDUSTREAM_DOMAIN:-localhost}`)
        - traefik.http.routers.${ENV}-worker-manager-secure.tls=true
        - traefik.http.routers.${ENV}-worker-manager-secure.service=${ENV}-worker-manager
        - traefik.http.routers.${ENV}-worker-manager-secure.middlewares=traefik-auth@file,rate-limit@file,allow-iframe@file
        - traefik.http.routers.${ENV}-worker-manager.entrypoints=web
        - traefik.http.routers.${ENV}-worker-manager.rule=Host(`workers.${INDUSTREAM_DOMAIN:-localhost}`)
        - traefik.http.routers.${ENV}-worker-manager.middlewares=redirect-to-https@file
        - traefik.http.services.${ENV}-worker-manager.loadbalancer.server.port=3000
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          cpus: '0.25'
          memory: 64M
        reservations:
          cpus: '0.03'
          memory: 32M
      restart_policy:
        condition: any
        delay: 10s
        window: 120s


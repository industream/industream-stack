# =============================================================================
# INDUSTREAM PLATFORM - DEMO SIMULATORS
# =============================================================================
# Industrial data simulators for demonstration purposes
# Deploy with: ./scripts/deploy-swarm.sh --env prod --with-demo
#
# Simulators included:
# - OPC-UA Server (Microsoft PLC Simulator)
# - MQTT Broker + Industrial Data Simulator
# - Siemens S7 PLC Simulator
# - Modbus TCP Simulator
#
# Scenarios simulated:
# - Electric Arc Furnace (EAF) - Steel production
# - Blast Furnace - Iron production
# - Energy consumption monitoring
# - Production line metrics
#
# Network Configuration (realistic industrial setup):
# - Dedicated subnet: 10.99.0.0/24
# - MQTT Broker:      10.99.0.10:1883
# - Modbus TCP:       10.99.0.20:502
# - OPC-UA Server:    10.99.0.30:50000
# - S7 PLC:           10.99.0.40:102
# =============================================================================

services:
  # ============================================
  # OPC-UA SIMULATOR
  # ============================================
  # Microsoft OPC PLC Simulator - Industrial PLC data
  # Endpoint: opc.tcp://10.99.0.30:50000
  opcua-simulator:
    image: mcr.microsoft.com/iotedge/opc-plc:latest
    command:
      - --autoaccept
      - --unsecuretransport
      - --portnum=50000
      - --rate=1000
      - --guidnodes=5
      - --fastnodes=50
      - --slownodes=100
      - --veryfastnodecount=10
      - --veryfastnoderate=100
    environment:
      - TZ=${TZ:-Europe/Berlin}
    ports:
      - target: 50000
        published: 50000
        protocol: tcp
        mode: ingress
    networks:
      ${ENV}-platform:
      demo-simulators:
        ipv4_address: 10.99.0.30
    healthcheck:
      test: ["NONE"]
    deploy:
      mode: replicated
      replicas: 1
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.03'
          memory: 128M
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 0
        window: 120s

  # ============================================
  # MQTT BROKER & SIMULATOR
  # ============================================
  # Eclipse Mosquitto MQTT Broker
  # Endpoint: mqtt://10.99.0.10:1883
  mqtt-broker:
    image: eclipse-mosquitto:2
    configs:
      - source: ${ENV}_mosquitto_config
        target: /mosquitto/config/mosquitto.conf
    volumes:
      - ${ENV}-mqtt-data:/mosquitto/data
      - ${ENV}-mqtt-log:/mosquitto/log
    ports:
      - target: 1883
        published: 1883
        protocol: tcp
        mode: ingress
      - target: 9001
        published: 9001
        protocol: tcp
        mode: ingress
    networks:
      ${ENV}-platform:
      demo-simulators:
        ipv4_address: 10.99.0.10
    healthcheck:
      test: ["NONE"]
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
        reservations:
          cpus: '0.02'
          memory: 32M
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 0
        window: 60s

  # ============================================
  # SIEMENS S7 PLC SIMULATOR
  # ============================================
  # SoftPLC - S7 Protocol Simulator
  # S7 Endpoint: 10.99.0.40:102
  # REST API: http://10.99.0.40:8080/swagger
  s7-simulator:
    image: fbarresi/softplc:latest-linux
    environment:
      - DATA_PATH=/demodata
      - TZ=${TZ:-Europe/Berlin}
    ports:
      - target: 102
        published: 102
        protocol: tcp
        mode: ingress
      - target: 8080
        published: 8082
        protocol: tcp
        mode: ingress
    networks:
      ${ENV}-platform:
      demo-simulators:
        ipv4_address: 10.99.0.40
    healthcheck:
      test: ["NONE"]
    deploy:
      mode: replicated
      replicas: 1
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.03'
          memory: 64M
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 0
        window: 120s

  # ============================================
  # MODBUS TCP SIMULATOR
  # ============================================
  # Modbus TCP Server Simulator
  # Endpoint: 10.99.0.20:502 (internal) / host:5020 (external)
  modbus-simulator:
    image: oitc/modbus-server:latest
    configs:
      - source: ${ENV}_modbus_config
        target: /etc/modbus/config.json
    ports:
      - target: 5020
        published: 5020
        protocol: tcp
        mode: ingress
    networks:
      ${ENV}-platform:
      demo-simulators:
        ipv4_address: 10.99.0.20
    healthcheck:
      test: ["NONE"]
    deploy:
      mode: replicated
      replicas: 1
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
        reservations:
          cpus: '0.02'
          memory: 32M
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 0
        window: 60s

  # ============================================
  # INDUSTRIAL DATA GENERATOR
  # ============================================
  # Generates realistic industrial data for:
  # - Electric Arc Furnace (EAF)
  # - Blast Furnace
  # - Energy consumption
  # - Production metrics
  industrial-simulator:
    image: python:3.11-slim
    command: >
      bash -c "pip install --quiet paho-mqtt influxdb-client && python /app/industrial-simulator.py"
    configs:
      - source: ${ENV}_industrial_simulator
        target: /app/industrial-simulator.py
    environment:
      - PYTHONUNBUFFERED=1
      - MQTT_BROKER=mqtt-broker
      - MQTT_PORT=1883
      - INFLUXDB_URL=http://influxdb:8086
      - INFLUXDB_ORG=${INFLUX_ORG:-industream}
      - INFLUXDB_BUCKET=${INFLUX_BUCKET:-industream}
      - SIMULATION_INTERVAL=1
      - TZ=${TZ:-Europe/Berlin}
    secrets:
      - ${ENV}_influx_admin_token
    networks:
      ${ENV}-platform:
      demo-simulators:
        ipv4_address: 10.99.0.50
    deploy:
      mode: replicated
      replicas: 1
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
        reservations:
          cpus: '0.02'
          memory: 128M
      restart_policy:
        condition: on-failure
        delay: 15s
        max_attempts: 5
        window: 120s

# ============================================
# CONFIGS
# ============================================
configs:
  ${ENV}_mosquitto_config:
    file: ./config/demo/mqtt/mosquitto.conf
  ${ENV}_modbus_config:
    file: ./config/demo/modbus/modbus-config.json
  ${ENV}_industrial_simulator:
    file: ./config/demo/industrial-simulator.py

# ============================================
# SECRETS
# ============================================
secrets:
  ${ENV}_influx_admin_token:
    external: true

# ============================================
# VOLUMES
# ============================================
volumes:
  ${ENV}-mqtt-data:
  ${ENV}-mqtt-log:

# ============================================
# NETWORKS
# ============================================
networks:
  ${ENV}-platform:
  demo-simulators:
    driver: overlay
    attachable: true
    ipam:
      config:
        - subnet: 10.99.0.0/24

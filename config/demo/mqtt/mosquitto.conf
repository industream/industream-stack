# Mosquitto MQTT Broker Configuration for Industream Demo
# =====================================================

# Listener configuration
listener 1883
protocol mqtt

# WebSocket listener for browser clients
listener 9001
protocol websockets

# Allow anonymous connections (demo only)
allow_anonymous true

# Logging
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information

# Persistence
persistence true
persistence_location /mosquitto/data/

# Message size limit (1MB)
message_size_limit 1048576

# Connection settings
max_connections -1
max_inflight_messages 20
max_queued_messages 1000

# ============================================
# INDUSTREAM LOCAL DNS - dnsmasq configuration
# ============================================
# This provides wildcard DNS resolution for *.industream.lan
# without modifying /etc/hosts on client machines

# Don't read /etc/hosts on the dnsmasq container
no-hosts

# Don't use /etc/resolv.conf
no-resolv

# ============================================
# WILDCARD DNS FOR INDUSTREAM
# ============================================
# All *.industream.lan subdomains resolve to the server IP
# The address is passed via command line: --address=/industream.lan/IP
# This allows dynamic configuration via INDUSTREAM_SERVER_IP env var

# ============================================
# UPSTREAM DNS SERVERS
# ============================================
# Forward all other DNS queries to these servers
# Using Cloudflare and Google as fallbacks
# In air-gapped environments, replace with corporate DNS servers
server=1.1.1.1
server=8.8.8.8

# Alternative for corporate environments (uncomment and set your DNS):
# server=192.168.1.1
# server=/corp.local/192.168.1.1

# ============================================
# PERFORMANCE & CACHE SETTINGS
# ============================================
# Cache DNS results (default: 150)
cache-size=1000

# Log queries (useful for debugging, disable in production)
# log-queries

# Don't poll for changes to /etc/resolv.conf
no-poll

# Listen on all interfaces
interface=*

# Bind only to specific interfaces (if needed)
# bind-interfaces

# ============================================
# SECURITY SETTINGS
# ============================================
# Don't forward queries without a domain part
domain-needed

# Don't forward reverse lookups for private ranges
bogus-priv

# ============================================
# DHCP (DISABLED - DNS only mode)
# ============================================
# Uncomment below if you want dnsmasq to also provide DHCP
# dhcp-range=192.168.100.100,192.168.100.200,12h
# dhcp-option=option:router,192.168.100.1
# dhcp-option=option:dns-server,192.168.100.1

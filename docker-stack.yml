# =============================================================================
# INDUSTREAM PLATFORM - CORE INFRASTRUCTURE
# =============================================================================
# Base services: PostgreSQL, Keycloak, UIFusion
#
# Multi-environment support: Uses ${ENV} prefix for isolation
# Environments: prod, dev, staging
#
# Prerequisites:
#   1. Deploy Traefik shared stack: ./scripts/deploy-traefik.sh
#   2. Create secrets: ./scripts/setup/create-secrets.sh --env ${ENV}
#
# Usage: ./scripts/deploy-swarm.sh --env prod|dev|staging
# =============================================================================

services:
  # ==========================================
  # POSTGRESQL - Database
  # ==========================================
  postgres:
    image: postgres:${POSTGRES_VERSION:-17.4}
    hostname: postgres
    environment:
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:-postgres}
      POSTGRES_PASSWORD_FILE: /run/secrets/${ENV}_postgres_admin_password
      POSTGRES_MULTIPLE_DATABASES: keycloak:keycloak:FROM_SECRET,industream:dashboard:FROM_SECRET,DataCatalog:datacatalog:FROM_SECRET,DataBridge:databridge:FROM_SECRET
    volumes:
    - ${ENV}-postgres-data:/var/lib/postgresql/data
    - ./scripts/setup/init-postgres.sh:/docker-entrypoint-initdb.d/init-postgres.sh:ro
    networks:
    - traefik-public
    - ${ENV}-platform
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U ${POSTGRES_ADMIN_USER:-postgres} -d postgres
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    secrets:
    - ${ENV}_postgres_admin_password
    - ${ENV}_keycloak_db_password
    - ${ENV}_grafana_db_password
    - ${ENV}_datacatalog_db_password
    - ${ENV}_databridge_pg_password
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 256M
        reservations:
          cpus: '0.08'
          memory: 128M
      restart_policy:
        condition: any
        delay: 5s
        max_attempts: 0
        window: 120s

  # ==========================================
  # KEYCLOAK - Identity & Access Management
  # ==========================================
  keycloak:
    image: keycloak/keycloak:${KEYCLOAK_VERSION:-26.1.0}
    hostname: keycloak-service
    environment:
    - KC_DB=postgres
    - KC_DB_USERNAME=keycloak
    - KC_DB_URL=jdbc:postgresql://postgres:5432/keycloak
    - KC_DB_PASSWORD_FILE=/run/secrets/${ENV}_keycloak_db_password
    - KC_BOOTSTRAP_ADMIN_USERNAME=${KEYCLOAK_ADMIN:-admin}
    - KC_BOOTSTRAP_ADMIN_PASSWORD_FILE=/run/secrets/${ENV}_keycloak_admin_password
    - KC_HTTP_RELATIVE_PATH=/auth
    - KC_PROXY_HEADERS=xforwarded
    - KC_HTTP_ENABLED=true
    volumes:
    - ./keycloak-realms:/opt/keycloak/data/import:ro
    - ./config/keycloak-entrypoint.sh:/opt/keycloak/custom-entrypoint.sh:ro
    entrypoint: ["/bin/bash", "/opt/keycloak/custom-entrypoint.sh"]
    networks:
    - traefik-public
    - ${ENV}-platform
    depends_on:
    - postgres
    command: start --hostname=${INDUSTREAM_DOMAIN:-localhost} --hostname-strict=false --import-realm
    healthcheck:
      test:
      - CMD-SHELL
      - bash -c 'exec 3<>/dev/tcp/localhost/8080' || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    secrets:
    - ${ENV}_keycloak_db_password
    - ${ENV}_keycloak_admin_password
    deploy:
      labels:
      - traefik.enable=true
      - traefik.http.routers.${ENV}-keycloak-secure.entrypoints=websecure
      - traefik.http.routers.${ENV}-keycloak-secure.rule=Host(`${INDUSTREAM_DOMAIN:-localhost}`) && PathPrefix(`/auth`)
      - traefik.http.routers.${ENV}-keycloak-secure.tls=true
      - traefik.http.routers.${ENV}-keycloak-secure.service=${ENV}-keycloak
      - traefik.http.routers.${ENV}-keycloak.entrypoints=web
      - traefik.http.routers.${ENV}-keycloak.rule=Host(`${INDUSTREAM_DOMAIN:-localhost}`) && PathPrefix(`/auth`)
      - traefik.http.routers.${ENV}-keycloak.middlewares=redirect-to-https@file
      - traefik.http.services.${ENV}-keycloak.loadbalancer.server.port=8080
      resources:
        limits:
          cpus: '2.0'
          memory: 1G
        reservations:
          cpus: '0.15'
          memory: 512M
      restart_policy:
        condition: any
        delay: 5s
        max_attempts: 0
        window: 120s

  # ==========================================
  # UIFUSION - Main Portal
  # ==========================================
  uifusion:
    image: ${DOCKER_REGISTRY:-842775dh.c1.gra9.container-registry.ovh.net}/uifusion/ui:${UIFUSION_VERSION:-1.0.8}
    environment:
    - NODE_ENV=production
    - UF_CONFIG_URL=https://${INDUSTREAM_DOMAIN:-localhost}/api/uifusion/api/config
    networks:
    - traefik-public
    - ${ENV}-platform
    depends_on:
    - keycloak
    - uifusion-api
    healthcheck:
      test:
      - CMD-SHELL
      - nc -z 127.0.0.1 80 || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      labels:
      - traefik.enable=true
      - traefik.http.routers.${ENV}-uifusion-ui-secure.entrypoints=websecure
      - traefik.http.routers.${ENV}-uifusion-ui-secure.rule=Host(`${INDUSTREAM_DOMAIN:-localhost}`) && !PathPrefix(`/auth`) && !PathPrefix(`/api/uifusion`)
      - traefik.http.routers.${ENV}-uifusion-ui-secure.tls=true
      - traefik.http.routers.${ENV}-uifusion-ui-secure.service=${ENV}-uifusion-ui
      - traefik.http.routers.${ENV}-uifusion-ui.entrypoints=web
      - traefik.http.routers.${ENV}-uifusion-ui.rule=Host(`${INDUSTREAM_DOMAIN:-localhost}`) && !PathPrefix(`/auth`) && !PathPrefix(`/api/uifusion`)
      - traefik.http.routers.${ENV}-uifusion-ui.middlewares=redirect-to-https@file
      - traefik.http.services.${ENV}-uifusion-ui.loadbalancer.server.port=80
      resources:
        limits:
          cpus: '0.5'
          memory: 64M
        reservations:
          cpus: '0.03'
          memory: 32M
      restart_policy:
        condition: any
        delay: 5s
        max_attempts: 0
        window: 120s

  uifusion-api:
    image: ${DOCKER_REGISTRY:-842775dh.c1.gra9.container-registry.ovh.net}/uifusion/api:${UIFUSION_API_VERSION:-1.0.6}
    environment:
    - CONFIG_PATH=/app/data/config.json
    volumes:
    - ./config/uifusion:/app/data
    networks:
    - traefik-public
    - ${ENV}-platform
    healthcheck:
      test:
      - CMD
      - wget
      - --no-verbose
      - --tries=1
      - --spider
      - http://localhost:3001/health
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    deploy:
      labels:
      - traefik.enable=true
      - traefik.http.routers.${ENV}-uifusion-api-secure.entrypoints=websecure
      - traefik.http.routers.${ENV}-uifusion-api-secure.rule=Host(`${INDUSTREAM_DOMAIN:-localhost}`) && PathPrefix(`/api/uifusion`)
      - traefik.http.routers.${ENV}-uifusion-api-secure.tls=true
      - traefik.http.routers.${ENV}-uifusion-api-secure.service=${ENV}-uifusion-api
      - traefik.http.routers.${ENV}-uifusion-api-secure.middlewares=${ENV}-uifusion-api-stripprefix
      - traefik.http.routers.${ENV}-uifusion-api.entrypoints=web
      - traefik.http.routers.${ENV}-uifusion-api.rule=Host(`${INDUSTREAM_DOMAIN:-localhost}`) && PathPrefix(`/api/uifusion`)
      - traefik.http.routers.${ENV}-uifusion-api.middlewares=redirect-to-https@file
      - traefik.http.middlewares.${ENV}-uifusion-api-stripprefix.stripprefix.prefixes=/api/uifusion
      - traefik.http.services.${ENV}-uifusion-api.loadbalancer.server.port=3001
      # Uploads route (no prefix strip - API handles /api/uploads directly)
      - traefik.http.routers.${ENV}-uifusion-uploads-secure.entrypoints=websecure
      - traefik.http.routers.${ENV}-uifusion-uploads-secure.rule=Host(`${INDUSTREAM_DOMAIN:-localhost}`) && PathPrefix(`/api/uploads`)
      - traefik.http.routers.${ENV}-uifusion-uploads-secure.tls=true
      - traefik.http.routers.${ENV}-uifusion-uploads-secure.service=${ENV}-uifusion-api
      resources:
        limits:
          cpus: '0.25'
          memory: 64M
        reservations:
          cpus: '0.03'
          memory: 32M
      restart_policy:
        condition: any
        delay: 5s
        max_attempts: 0
        window: 120s


  # ==========================================
  # MINIO - Object Storage (S3-compatible)
  # ==========================================
  minio:
    image: minio/minio:${MINIO_VERSION:-RELEASE.2025-02-07T23-21-09Z}
    hostname: minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER_FILE: /run/secrets/${ENV}_minio_root_user
      MINIO_ROOT_PASSWORD_FILE: /run/secrets/${ENV}_minio_root_password
    volumes:
    - ${ENV}-minio-data:/data
    networks:
    - traefik-public
    - ${ENV}-platform
    secrets:
    - ${ENV}_minio_root_user
    - ${ENV}_minio_root_password
    healthcheck:
      test:
      - CMD-SHELL
      - mc ready local || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      labels:
      - traefik.enable=true
      # Minio API (S3)
      - traefik.http.routers.${ENV}-minio-api-secure.entrypoints=websecure
      - traefik.http.routers.${ENV}-minio-api-secure.rule=Host(`s3.${INDUSTREAM_DOMAIN:-localhost}`)
      - traefik.http.routers.${ENV}-minio-api-secure.tls=true
      - traefik.http.routers.${ENV}-minio-api-secure.service=${ENV}-minio-api
      - traefik.http.services.${ENV}-minio-api.loadbalancer.server.port=9000
      # Minio Console
      - traefik.http.routers.${ENV}-minio-console-secure.entrypoints=websecure
      - traefik.http.routers.${ENV}-minio-console-secure.rule=Host(`minio.${INDUSTREAM_DOMAIN:-localhost}`)
      - traefik.http.routers.${ENV}-minio-console-secure.tls=true
      - traefik.http.routers.${ENV}-minio-console-secure.service=${ENV}-minio-console
      - traefik.http.services.${ENV}-minio-console.loadbalancer.server.port=9001
      # Allow iframe embedding in UIFusion
      - traefik.http.middlewares.${ENV}-minio-headers.headers.customresponseheaders.X-Frame-Options=
      - traefik.http.middlewares.${ENV}-minio-headers.headers.customresponseheaders.Content-Security-Policy=
      - traefik.http.routers.${ENV}-minio-console-secure.middlewares=${ENV}-minio-headers
      resources:
        limits:
          cpus: 1.0
          memory: 768M
        reservations:
          cpus: 0.08
          memory: 256M
      restart_policy:
        condition: any
        delay: 5s
        max_attempts: 0
        window: 120s

  # ==========================================
  # CLOUDBEAVER - Database Administration
  # ==========================================
# =============================================================================
# NETWORKS
# =============================================================================
networks:
  traefik-public:
    external: true
    name: traefik-shared_traefik-public
  ${ENV}-platform:
    driver: overlay
    attachable: true

# =============================================================================
# VOLUMES
# =============================================================================
volumes:
  ${ENV}-postgres-data:
  ${ENV}-minio-data:

# =============================================================================
# SECRETS
# =============================================================================
secrets:
  ${ENV}_postgres_admin_password:
    external: true
  ${ENV}_keycloak_admin_password:
    external: true
  ${ENV}_keycloak_db_password:
    external: true
  ${ENV}_grafana_admin_password:
    external: true
  ${ENV}_grafana_db_password:
    external: true
  ${ENV}_datacatalog_db_password:
    external: true
  ${ENV}_influx_admin_password:
    external: true
  ${ENV}_influx_admin_token:
    external: true
  ${ENV}_minio_root_user:
    external: true
  ${ENV}_minio_root_password:
    external: true
  ${ENV}_databridge_pg_password:
    external: true
  ${ENV}_timescaledb_password:
    external: true

# =============================================================================
# CONFIGS
# =============================================================================

# =============================================================================
# Grafana SSO — trust the self-signed platform CA (TLS_MODE=selfsigned only)
# =============================================================================
# Companion to docker-stack.grafana-wrapper.yml. Grafana fetches the Hub JWKS
# over HTTPS through Traefik; with TLS_MODE=selfsigned that cert is signed by
# the platform's own CA, which Grafana does NOT trust by default.
#
# Grafana 13 ignores GF_AUTH_JWT_TLS_SKIP_VERIFY_INSECURE for the JWKS fetch, so
# the cert must be genuinely trusted. We do that WITHOUT running Grafana as root
# (no entrypoint hack, no update-ca-certificates): Go honors SSL_CERT_FILE and
# SSL_CERT_DIR additively for the system cert pool —
#   - SSL_CERT_FILE = the image's Mozilla root bundle (public roots preserved),
#   - SSL_CERT_DIR  = a dir holding ONLY the platform cert (mounted read-only).
# Result: Mozilla roots + platform cert, Grafana stays uid 472.
#
# Applied automatically by deploy-swarm.sh when TLS_MODE=selfsigned. The cert
# file is the one Traefik serves: certs/${INDUSTREAM_DOMAIN}.crt (generated by
# scripts/generate/generate-certs.sh).
#
# Manual deploy:
#   docker stack deploy -c docker-stack.yml [...] \
#     -c docker-stack.grafana-wrapper.yml \
#     -c docker-stack.grafana-wrapper-selfsigned.yml ${ENV}
# =============================================================================
services:
  grafana:
    environment:
    # Keep the public Mozilla root bundle (so TLS to any other host still works).
    - SSL_CERT_FILE=/etc/ssl/certs/ca-certificates.crt
    # Additional trusted roots: the dir below holds the platform self-signed cert.
    - SSL_CERT_DIR=/etc/grafana/extra-cas
    volumes:
    # Traefik's self-signed leaf/CA, mounted read-only into the extra-CA dir.
    - ./certs/${INDUSTREAM_DOMAIN}.crt:/etc/grafana/extra-cas/platform.crt:ro

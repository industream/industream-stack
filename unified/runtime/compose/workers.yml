# =============================================================================
# runtime/compose/workers.yml — plain-compose overlay for the worker fleet.
# =============================================================================
# Owns ONLY the compose-topology concerns the neutral base must not carry:
#   - the shared external `flowmaker-net` (named by ${FM_NETWORK}), the single
#     flat bridge the compose FlowMaker stack joins (vs swarm's ${ENV}-platform
#     overlay).
#   - `restart: unless-stopped` (compose has no swarm restart_policy).
#   - `profiles: [premium]` on the 4 enterprise workers so a CE `docker compose
#     up` skips them; enable with `--profile premium` when entitled.
# Image + functional env come from base/workers.yml.
# =============================================================================

# Shared compose shape: flat external network + restart policy.
x-compose-worker: &compose-worker
  restart: unless-stopped
  networks:
    - flowmaker-net

services:
  worker-data-logger:
    <<: *compose-worker
  worker-timer:
    <<: *compose-worker
  worker-js-expression:
    <<: *compose-worker
  worker-http-client:
    <<: *compose-worker
  worker-postgres-client:
    <<: *compose-worker
  worker-timeseries:
    <<: *compose-worker
    hostname: worker-timeseries
  worker-influx-client-dc:
    <<: *compose-worker
  worker-notifications:
    <<: *compose-worker
  worker-mqtt-client:
    <<: *compose-worker
  worker-modbus-tcp:
    <<: *compose-worker
  worker-test-data-generator:
    <<: *compose-worker
  worker-conditional-validator:
    <<: *compose-worker
  worker-enqueue:
    <<: *compose-worker
  equation-solver:
    <<: *compose-worker
  worker-datacatalog-mapper:
    <<: *compose-worker

  # --- premium (entitlement-gated; `--profile premium`) ---
  worker-opc-ua-client:
    <<: *compose-worker
    profiles: ["premium"]
  worker-rtsp-client:
    <<: *compose-worker
    profiles: ["premium"]
  worker-luminosity-box:
    <<: *compose-worker
    profiles: ["premium"]
  worker-minio-sink:
    <<: *compose-worker
    profiles: ["premium"]

# =============================================================================
# NETWORKS — the shared external bridge created by the FlowMaker compose stack.
# =============================================================================
networks:
  flowmaker-net:
    name: ${FM_NETWORK:-flowmaker-net}
    external: true

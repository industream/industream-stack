# =============================================================================
# runtime/compose/data.yml — COMPOSE-only plumbing (Caddy labels/file secrets/
# restart/dedicated DBs/named volumes). Merged LAST over base/data.yml.
# =============================================================================
# Group: data. These services are swarm-ONLY today; this slice lets EE/CE-compose
# optionally run them. DB host + secret names/patterns come from
# runtime.compose.env (consumed by base interpolation), not here.
#
# Compose has no shared `postgres`, so the databridge-postgresql variant gets a
# dedicated DB (databridge-postgresql-db). InfluxDB/TimescaleDB secrets are FILE
# secrets resolved by the SAME entrypoints as swarm.
# =============================================================================
services:
  influxdb:
    networks:
      - flowmaker-net
    volumes:
      - influxdb-data:/var/lib/influxdb2
      - influxdb-config:/etc/influxdb2
    secrets:
      - influx_admin_password
      - influx_admin_token
    restart: unless-stopped
    labels:
      caddy: influxdb.${FM_DOMAIN}
      caddy.reverse_proxy: "{{upstreams 8086}}"
      caddy.tls.issuer: internal
      caddy.tls.issuer.lifetime: 24000h

  databridge:
    networks:
      - flowmaker-net
    secrets:
      - influx_admin_token
    restart: unless-stopped
    labels:
      caddy: databridge.${FM_DOMAIN}
      caddy.reverse_proxy: "{{upstreams 8080}}"
      caddy.tls.issuer: internal
      caddy.tls.issuer.lifetime: 24000h

  timescaledb:
    networks:
      - flowmaker-net
    volumes:
      - timescaledb-data:/var/lib/postgresql/data
    secrets:
      - timescaledb_password
    restart: unless-stopped

  databridge-postgresql:
    networks:
      - flowmaker-net
    depends_on:
      - databridge-postgresql-db
    secrets:
      - databridge_pg_password
    restart: unless-stopped
    labels:
      caddy: databridge-pg.${FM_DOMAIN}
      caddy.reverse_proxy: "{{upstreams 8080}}"
      caddy.tls.issuer: internal
      caddy.tls.issuer.lifetime: 24000h

  databridge-timescaledb:
    networks:
      - flowmaker-net
    secrets:
      - timescaledb_password
    restart: unless-stopped
    labels:
      caddy: databridge-tsdb.${FM_DOMAIN}
      caddy.reverse_proxy: "{{upstreams 8080}}"
      caddy.tls.issuer: internal
      caddy.tls.issuer.lifetime: 24000h

  # Dedicated DataBridge Postgres (compose topology; swarm uses the shared one).
  databridge-postgresql-db:
    image: postgres:${POSTGRES_VERSION}
    environment:
      - POSTGRES_DB=${DATABRIDGE_PG_DB_NAME:-DataBridge}
      - POSTGRES_USER=${DATABRIDGE_PG_DB_USER:-databridge}
      - POSTGRES_PASSWORD_FILE=/run/secrets/databridge_pg_password
      # postgres:18 refuses a bare /var/lib/postgresql/data mount — pin PGDATA
      # to a subdir (matches the shared postgres in base/data.yml).
      - PGDATA=/var/lib/postgresql/data/pgdata
    secrets:
      - databridge_pg_password
    volumes:
      - databridge-pgdata:/var/lib/postgresql/data
    networks:
      - flowmaker-net
    restart: unless-stopped

  # The shared `postgres` from base/data.yml leaks into compose (base is neutral);
  # compose uses dedicated DBs but postgres-exporter still targets host `postgres`,
  # so give it the compose secret + network so it starts. PGDATA is already pinned
  # in base/data.yml.
  postgres:
    networks:
      - flowmaker-net
    secrets:
      - postgres_admin_password
    restart: unless-stopped

secrets:
  postgres_admin_password:
    file: ${SECRETS_DIR:-./secrets}/postgres_admin_password
  influx_admin_password:
    file: ${SECRETS_DIR:-./secrets}/influx_admin_password
  influx_admin_token:
    file: ${SECRETS_DIR:-./secrets}/influx_admin_token
  timescaledb_password:
    file: ${SECRETS_DIR:-./secrets}/timescaledb_password
  databridge_pg_password:
    file: ${SECRETS_DIR:-./secrets}/databridge_pg_password

volumes:
  influxdb-data:
  influxdb-config:
  timescaledb-data:
  databridge-pgdata:

networks:
  flowmaker-net:
    external: true
    name: ${FM_NETWORK}

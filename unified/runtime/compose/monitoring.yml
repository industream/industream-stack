# =============================================================================
# runtime/compose/monitoring.yml — COMPOSE-only plumbing for the monitoring group.
# =============================================================================
# Owns Caddy labels / file-secrets / restart / flowmaker-net. Merged LAST over
# base/monitoring.yml.
#
# Grafana + grafana-wrapper + the dedicated Grafana Postgres moved to
# runtime/compose/grafana.yml (deployed with the platform). This overlay is the
# OPTIONAL observability backend (Prometheus + Alertmanager + exporters).
# =============================================================================
services:
  prometheus:
    networks:
      - flowmaker-net
    restart: unless-stopped
    labels:
      caddy: prometheus.${FM_DOMAIN:-flowmaker.localhost}
      caddy.reverse_proxy: "{{upstreams 9090}}"
      caddy.tls.issuer: internal
      caddy.tls.issuer.lifetime: 24000h

  node-exporter:
    networks:
      - flowmaker-net
    restart: unless-stopped

  cadvisor:
    networks:
      - flowmaker-net
    restart: unless-stopped

  postgres-exporter:
    secrets:
      - postgres_admin_password
    networks:
      - flowmaker-net
    restart: unless-stopped

  alertmanager:
    networks:
      - flowmaker-net
    restart: unless-stopped
    labels:
      caddy: alertmanager.${FM_DOMAIN:-flowmaker.localhost}
      caddy.reverse_proxy: "{{upstreams 9093}}"
      caddy.tls.issuer: internal
      caddy.tls.issuer.lifetime: 24000h

secrets:
  postgres_admin_password:
    file: ${SECRETS_DIR:-./secrets}/postgres_admin_password

volumes:
  prometheus-data:
  alertmanager-data:

networks:
  flowmaker-net:
    external: true
    name: ${FM_NETWORK}

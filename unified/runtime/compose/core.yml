# =============================================================================
# runtime/compose/core.yml — COMPOSE-only plumbing (Caddy labels/file secrets/
# restart/flowmaker-net). Merged LAST over base/core.yml.
# =============================================================================
# Owns everything orchestrator-specific for the core group on the compose tree:
#   - Caddy reverse-proxy labels
#   - file secrets for minio root user/password (named by *_SECRET_NAME in
#     runtime.compose.env, consumed by base/core.yml interpolation) — this
#     REPLACES the previous inline `MINIO_ROOT_USER=ROOTUSER /
#     MINIO_ROOT_PASSWORD=CHANGEME123` leak in the source compose.
#   - restart policy + flowmaker-net wiring
#
# The `industream-hub-backend` JWKS alias is NOT needed here: on the compose
# tree the canonical service is already named `industream-hub-backend` upstream,
# but under the unified base the canonical name is `industream-hub-backend`. Downstream
# compose consumers (flowmaker-*, datacatalog) must resolve JWKS via the
# industream-hub-backend service; the swarm tree supplies the alias, the compose tree
# relies on the canonical service name reachable on flowmaker-net.
# =============================================================================
services:
  industream-hub-backend:
    networks:
      - flowmaker-net
    restart: unless-stopped
    mem_limit: 256m
    mem_reservation: 32m
    secrets:
      - hub_jwt_signing_key
    labels:
      caddy: hub-api.${FM_DOMAIN}
      caddy.reverse_proxy: "{{upstreams 3050}}"
      caddy.tls.issuer: internal
      caddy.tls.issuer.lifetime: 24000h

  industream-hub-frontend:
    # Compose topology: the Hub backend + DataCatalog API are reached on their
    # OWN Caddy subdomains (not a path prefix like swarm's Traefik) — override the
    # base URLs so the SPA's auth-config.json points at the right hosts.
    environment:
      - HUB_BACKEND_URL=${FM_PROTOCOL:-https}://hub-api.${FM_DOMAIN}
      - DATACATALOG_URL=${FM_PROTOCOL:-https}://datacatalog-api.${FM_DOMAIN}
    networks:
      - flowmaker-net
    restart: unless-stopped
    labels:
      caddy: hub.${FM_DOMAIN}
      caddy.reverse_proxy: "{{upstreams 80}}"
      caddy.tls.issuer: internal
      caddy.tls.issuer.lifetime: 24000h
      # Apex (${FM_DOMAIN}): the app UIs load industream-login.js from the apex
      # origin AND the Hub token flow / Grafana JWKS fetch https://${FM_DOMAIN}/api/uifusion/*.
      # Route order matters: the /api/uifusion path handler proxies to the Hub
      # backend (prefix stripped → /auth/jwks etc.); the catch-all serves the SPA.
      caddy_1: ${FM_DOMAIN}
      caddy_1.tls.issuer: internal
      caddy_1.tls.issuer.lifetime: 24000h
      caddy_1.route.0_handle_path: /api/uifusion/*
      caddy_1.route.0_handle_path.0_reverse_proxy: industream-hub-backend:3050
      caddy_1.route.1_reverse_proxy: "{{upstreams 80}}"

  minio:
    networks:
      - flowmaker-net
    restart: unless-stopped
    secrets:
      - minio_root_user
      - minio_root_password
    labels:
      caddy: s3.${FM_DOMAIN}
      caddy.reverse_proxy: "{{upstreams 9000}}"
      caddy.tls.issuer: internal
      caddy.tls.issuer.lifetime: 24000h

  cdn-server:
    networks:
      - flowmaker-net
    restart: unless-stopped

  cdn-cache:
    networks:
      - flowmaker-net
    restart: unless-stopped
    labels:
      caddy: cdn.${FM_DOMAIN}
      caddy.reverse_proxy: "{{upstreams 8080}}"
      caddy.tls.issuer: internal
      caddy.tls.issuer.lifetime: 24000h

  # ---------------------------------------------------------------------------
  # Caddy reverse proxy — the COMPOSE ingress. Swarm uses Traefik (a separate
  # stack); the compose tree self-serves via caddy-docker-proxy, which reads the
  # `caddy.*` service labels above off the shared flowmaker-net and publishes
  # :80/:443. TLS is Caddy's internal CA (caddy.tls.issuer: internal) → browsers
  # warn until the local CA is trusted (root at /data/caddy/pki/authorities/local).
  # This service is compose-only (it lives in runtime/compose/, never merged on swarm).
  # ---------------------------------------------------------------------------
  caddy:
    image: lucaslorentz/caddy-docker-proxy:2.9-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      # Only proxy containers attached to the shared FlowMaker network.
      - CADDY_INGRESS_NETWORKS=${FM_NETWORK}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - flowmaker-net

# Literal secret names on the compose tree (compose does NOT interpolate the
# KEYS of the top-level secrets map). They MUST match MINIO_ROOT_USER_SECRET_NAME
# / MINIO_ROOT_PASSWORD_SECRET_NAME in runtime.compose.env (= minio_root_user /
# minio_root_password) so the /run/secrets/<name> paths in base/core.yml resolve.
secrets:
  minio_root_user:
    file: ${SECRETS_DIR:-./secrets}/minio_root_user
  minio_root_password:
    file: ${SECRETS_DIR:-./secrets}/minio_root_password
  hub_jwt_signing_key:
    file: ${SECRETS_DIR:-./secrets}/hub_jwt_signing_key

networks:
  flowmaker-net:
    external: true
    name: ${FM_NETWORK}

volumes:
  caddy-data:      # Caddy certs + internal CA (persist across restarts)
  caddy-config:

# =============================================================================
# runtime/swarm/monitoring.yml — SWARM-only plumbing for the monitoring group.
# =============================================================================
# Owns everything orchestrator-specific: deploy:/Traefik labels/docker-secret
# objects/${ENV}-* overlay nets + volume names. Merged LAST over
# base/monitoring.yml.
#
# Secret NAMES + DB hosts come from runtime.swarm.env (consumed by base
# interpolation), not here. The grafana JWKS-over-selfsigned-CA trust mount
# (mirror of docker-stack.grafana-wrapper-selfsigned.yml) is folded in here so
# selfsigned swarm deploys validate the Hub JWT.
#
# Topology mirrors docker-stack.monitoring.yml + docker-stack.grafana-wrapper.yml:
#   browser → traefik → grafana-wrapper:8080 (nginx)  [owns dashboard.${DOMAIN}]
#                    ├─ /grafana/  → grafana:3000      (same-origin proxy)
#                    └─ grafana-direct.${DOMAIN}       (back-door, no wrapper)
# =============================================================================
services:
  # ---- Hub SPA: allow cross-subdomain iframe so the wrapper at
  # ---- dashboard.${DOMAIN} can embed the Hub auth-bridge iframe. Without it
  # ---- X-Frame-Options=SAMEORIGIN blocks the bridge → no JWT → Grafana 302
  # ---- /login. NB: `uifusion` is the SPA shell; `industream-hub-frontend-ui` is the router.
  industream-hub-frontend:
    deploy:
      labels:
        - traefik.http.routers.${ENV}-industream-hub-frontend-ui-secure.middlewares=allow-iframe@file

  grafana:
    # Route the public Hub hostname back to the swarm host so Grafana can fetch
    # JWKS over HTTPS via Traefik (:443 published port). host-gateway = the
    # Docker host bridge gateway = the swarm node itself.
    extra_hosts:
      - "${INDUSTREAM_DOMAIN}:host-gateway"
    environment:
      # Trust the platform self-signed CA so the JWKS fetch succeeds (Grafana 13
      # ignores tls_skip_verify). Go honors SSL_CERT_FILE (public Mozilla roots)
      # + SSL_CERT_DIR (extra roots) additively → uid 472 stays non-root.
      # TLS_MODE=selfsigned only; with letsencrypt the public cert is already
      # trusted and the cert mount below is a harmless empty dir.
      - SSL_CERT_FILE=/etc/ssl/certs/ca-certificates.crt
      - SSL_CERT_DIR=/etc/grafana/extra-cas
    volumes:
      # Traefik's self-signed leaf/CA mounted read-only into the extra-CA dir.
      - ./certs/${INDUSTREAM_DOMAIN}.crt:/etc/grafana/extra-cas/platform.crt:ro
    networks:
      - traefik-public
      - platform
    # Cross-group startup ordering (services defined in core group): swarm uses
    # the SHARED postgres for Grafana's DB.
    depends_on:
      - postgres
      - industream-hub-backend
    secrets:
      - source: grafana_admin_password
        target: ${ENV}_grafana_admin_password
      - source: grafana_db_password
        target: ${ENV}_grafana_db_password
      - source: influx_admin_token
        target: ${ENV}_influx_admin_token
      - source: datacatalog_db_password
        target: ${ENV}_datacatalog_db_password
      - source: datacatalog_api_key
        target: ${ENV}_datacatalog_api_key
      - source: postgres_admin_password
        target: ${ENV}_postgres_admin_password
    deploy:
      labels:
        - traefik.enable=true
        # grafana-direct.* = admin back-door to Grafana without the wrapper.
        # The wrapper owns dashboard.${DOMAIN} (see grafana-wrapper below).
        - traefik.http.routers.${ENV}-grafana-secure.entrypoints=websecure
        - traefik.http.routers.${ENV}-grafana-secure.rule=Host(`grafana-direct.${INDUSTREAM_DOMAIN}`)
        - traefik.http.routers.${ENV}-grafana-secure.tls=true
        - traefik.http.routers.${ENV}-grafana-secure.service=${ENV}-grafana
        - traefik.http.routers.${ENV}-grafana-secure.middlewares=allow-iframe@file
        - traefik.http.routers.${ENV}-grafana.entrypoints=web
        - traefik.http.routers.${ENV}-grafana.rule=Host(`grafana-direct.${INDUSTREAM_DOMAIN}`)
        - traefik.http.routers.${ENV}-grafana.middlewares=redirect-to-https@file
        - traefik.http.services.${ENV}-grafana.loadbalancer.server.port=3000
        # WebSocket router on dashboard.${DOMAIN}/grafana/api/live/* — higher
        # priority than the wrapper catch-all. Grafana serves at /grafana/* via
        # serve_from_sub_path=true, so no stripprefix.
        - traefik.http.routers.${ENV}-grafana-live-secure.entrypoints=websecure
        - traefik.http.routers.${ENV}-grafana-live-secure.rule=Host(`dashboard.${INDUSTREAM_DOMAIN}`) && PathPrefix(`/grafana/api/live`)
        - traefik.http.routers.${ENV}-grafana-live-secure.tls=true
        - traefik.http.routers.${ENV}-grafana-live-secure.service=${ENV}-grafana
        - traefik.http.routers.${ENV}-grafana-live-secure.middlewares=allow-iframe@file
        - traefik.http.routers.${ENV}-grafana-live-secure.priority=200
      resources:
        # Grafana 13 + GF_INSTALL_PLUGINS (installs 3-4 plugins at boot) spikes
        # well past 384M → OOMKilled crash-loop on swarm. 1024M is the safe floor.
        limits:       { cpus: '0.5', memory: 1024M }
        reservations: { cpus: '0.08', memory: 256M }
      restart_policy: { condition: any, delay: 10s, max_attempts: 0, window: 120s }

  grafana-wrapper:
    networks:
      - traefik-public
      - platform
    depends_on:
      - industream-hub-backend
    deploy:
      labels:
        - traefik.enable=true
        - traefik.http.routers.${ENV}-grafana-wrapper-secure.entrypoints=websecure
        - traefik.http.routers.${ENV}-grafana-wrapper-secure.rule=Host(`dashboard.${INDUSTREAM_DOMAIN}`)
        - traefik.http.routers.${ENV}-grafana-wrapper-secure.tls=true
        - traefik.http.routers.${ENV}-grafana-wrapper-secure.service=${ENV}-grafana-wrapper
        - traefik.http.routers.${ENV}-grafana-wrapper-secure.middlewares=allow-iframe@file
        - traefik.http.routers.${ENV}-grafana-wrapper.entrypoints=web
        - traefik.http.routers.${ENV}-grafana-wrapper.rule=Host(`dashboard.${INDUSTREAM_DOMAIN}`)
        - traefik.http.routers.${ENV}-grafana-wrapper.middlewares=redirect-to-https@file
        - traefik.http.services.${ENV}-grafana-wrapper.loadbalancer.server.port=8080
      resources:
        limits:       { cpus: '0.1', memory: 64M }
        reservations: { cpus: '0.01', memory: 16M }
      restart_policy: { condition: any, delay: 5s, window: 120s }

  prometheus:
    networks:
      - traefik-public
      - platform
    deploy:
      labels:
        - traefik.enable=true
        - traefik.http.routers.${ENV}-prometheus-secure.entrypoints=websecure
        - traefik.http.routers.${ENV}-prometheus-secure.rule=Host(`prometheus.${INDUSTREAM_DOMAIN}`)
        - traefik.http.routers.${ENV}-prometheus-secure.tls=true
        - traefik.http.routers.${ENV}-prometheus-secure.service=${ENV}-prometheus
        - traefik.http.routers.${ENV}-prometheus-secure.middlewares=traefik-auth@file,rate-limit@file,allow-iframe@file
        - traefik.http.routers.${ENV}-prometheus.entrypoints=web
        - traefik.http.routers.${ENV}-prometheus.rule=Host(`prometheus.${INDUSTREAM_DOMAIN}`)
        - traefik.http.routers.${ENV}-prometheus.middlewares=redirect-to-https@file
        - traefik.http.services.${ENV}-prometheus.loadbalancer.server.port=9090
      resources:
        limits:       { cpus: '1.0', memory: 768M }
        reservations: { cpus: '0.08', memory: 256M }
      restart_policy: { condition: any, delay: 5s, max_attempts: 0, window: 120s }

  node-exporter:
    networks:
      - platform
    deploy:
      mode: global
      resources:
        limits:       { cpus: '0.1', memory: 64M }
        reservations: { cpus: '0.02', memory: 32M }
      restart_policy: { condition: any, delay: 5s, max_attempts: 0, window: 120s }

  cadvisor:
    networks:
      - platform
    deploy:
      mode: global
      resources:
        limits:       { cpus: '0.5', memory: 128M }
        reservations: { cpus: '0.08', memory: 64M }
      restart_policy: { condition: any, delay: 5s, max_attempts: 0, window: 120s }

  postgres-exporter:
    networks:
      - platform
    depends_on:
      - postgres
    secrets:
      - source: postgres_admin_password
        target: ${ENV}_postgres_admin_password
    deploy:
      resources:
        limits:       { cpus: '0.1', memory: 64M }
        reservations: { cpus: '0.02', memory: 32M }
      restart_policy: { condition: any, delay: 5s, max_attempts: 0, window: 120s }

  alertmanager:
    networks:
      - traefik-public
      - platform
    deploy:
      labels:
        - traefik.enable=true
        - traefik.http.routers.${ENV}-alertmanager-secure.entrypoints=websecure
        - traefik.http.routers.${ENV}-alertmanager-secure.rule=Host(`alertmanager.${INDUSTREAM_DOMAIN}`)
        - traefik.http.routers.${ENV}-alertmanager-secure.tls=true
        - traefik.http.routers.${ENV}-alertmanager-secure.service=${ENV}-alertmanager
        - traefik.http.routers.${ENV}-alertmanager-secure.middlewares=traefik-auth@file,rate-limit@file,allow-iframe@file
        - traefik.http.routers.${ENV}-alertmanager.entrypoints=web
        - traefik.http.routers.${ENV}-alertmanager.rule=Host(`alertmanager.${INDUSTREAM_DOMAIN}`)
        - traefik.http.routers.${ENV}-alertmanager.middlewares=redirect-to-https@file
        - traefik.http.services.${ENV}-alertmanager.loadbalancer.server.port=9093
      resources:
        limits:       { cpus: '0.1', memory: 64M }
        reservations: { cpus: '0.02', memory: 32M }
      restart_policy: { condition: any, delay: 5s, max_attempts: 0, window: 120s }

secrets:
  grafana_admin_password:
    name: ${ENV}_grafana_admin_password
    external: true
  grafana_db_password:
    name: ${ENV}_grafana_db_password
    external: true
  postgres_admin_password:
    name: ${ENV}_postgres_admin_password
    external: true
  datacatalog_db_password:
    name: ${ENV}_datacatalog_db_password
    external: true
  datacatalog_api_key:
    name: ${ENV}_datacatalog_api_key
    external: true
  influx_admin_token:
    name: ${ENV}_influx_admin_token
    external: true

volumes:
  grafana-data:      { name: "${ENV}-grafana-data" }
  prometheus-data:   { name: "${ENV}-prometheus-data" }
  alertmanager-data: { name: "${ENV}-alertmanager-data" }

networks:
  traefik-public:
    external: true
    name: traefik-shared_traefik-public
  platform:
    name: ${ENV}-platform
    driver: overlay
    attachable: true

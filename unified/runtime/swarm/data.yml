# =============================================================================
# runtime/swarm/data.yml — SWARM-only plumbing (deploy:/Traefik labels/docker
# secrets/overlay nets/named volumes). Merged LAST over base/data.yml.
# =============================================================================
# Group: data. DB host + secret names/patterns come from runtime.swarm.env
# (consumed by base interpolation), not here. Topology: shared `postgres` for
# the databridge-postgresql variant; dedicated influxdb/timescaledb services.
# =============================================================================
services:
  postgres:
    hostname: postgres
    networks:
      - platform
    volumes:
      - postgres-data:/var/lib/postgresql/data
    # init-postgres.sh reads each user's password from /run/secrets/*_<pattern>,
    # so every app DB password must be mounted here (admin pw drives POSTGRES_PASSWORD_FILE).
    secrets:
      - source: postgres_admin_password
        target: ${ENV}_postgres_admin_password
      - source: grafana_db_password
        target: ${ENV}_grafana_db_password
      - source: datacatalog_db_password
        target: ${ENV}_datacatalog_db_password
      - source: databridge_pg_password
        target: ${ENV}_databridge_pg_password
    deploy:
      resources:
        limits:   { cpus: '1.0', memory: 1024M }
        reservations: { cpus: '0.08', memory: 512M }
      restart_policy:
        condition: any
        delay: 5s
        max_attempts: 0
        window: 120s

  influxdb:
    networks:
      - traefik-public
      - platform
    volumes:
      - influxdb-data:/var/lib/influxdb2
      - influxdb-config:/etc/influxdb2
    secrets:
      - source: influx_admin_password
        target: ${ENV}_influx_admin_password
      - source: influx_admin_token
        target: ${ENV}_influx_admin_token
    deploy:
      labels:
        - traefik.enable=true
        - traefik.http.routers.${ENV}-influxdb-secure.entrypoints=websecure
        - traefik.http.routers.${ENV}-influxdb-secure.rule=Host(`influxdb.${INDUSTREAM_DOMAIN}`)
        - traefik.http.routers.${ENV}-influxdb-secure.tls=true
        - traefik.http.routers.${ENV}-influxdb-secure.service=${ENV}-influxdb
        - traefik.http.routers.${ENV}-influxdb-secure.middlewares=allow-iframe@file
        - traefik.http.services.${ENV}-influxdb.loadbalancer.server.port=8086
      resources:
        limits:   { cpus: '2.0', memory: 768M }
        reservations: { cpus: '0.15', memory: 256M }
      restart_policy:
        condition: any
        delay: 5s
        max_attempts: 0
        window: 120s

  databridge:
    networks:
      - traefik-public
      - platform
    secrets:
      - source: influx_admin_token
        target: ${ENV}_influx_admin_token
    deploy:
      labels:
        - traefik.enable=true
        - traefik.http.routers.${ENV}-databridge-secure.entrypoints=websecure
        - traefik.http.routers.${ENV}-databridge-secure.rule=Host(`databridge.${INDUSTREAM_DOMAIN}`)
        - traefik.http.routers.${ENV}-databridge-secure.tls=true
        - traefik.http.routers.${ENV}-databridge-secure.service=${ENV}-databridge
        - traefik.http.routers.${ENV}-databridge-secure.middlewares=allow-iframe@file
        - traefik.http.routers.${ENV}-databridge.entrypoints=web
        - traefik.http.routers.${ENV}-databridge.rule=Host(`databridge.${INDUSTREAM_DOMAIN}`)
        - traefik.http.routers.${ENV}-databridge.middlewares=redirect-to-https@file
        - traefik.http.middlewares.${ENV}-databridge-stripprefix.stripprefix.prefixes=/api/databridge
        - traefik.http.services.${ENV}-databridge.loadbalancer.server.port=8080
      resources:
        limits:   { cpus: '0.5', memory: 256M }
        reservations: { cpus: '0.08', memory: 128M }
      restart_policy:
        condition: any
        delay: 5s
        max_attempts: 0
        window: 120s

  timescaledb:
    networks:
      - platform
    volumes:
      - timescaledb-data:/var/lib/postgresql/data
    secrets:
      - source: timescaledb_password
        target: ${ENV}_timescaledb_password
    deploy:
      resources:
        limits:   { cpus: '2.0', memory: 1024M }
        reservations: { cpus: '0.15', memory: 256M }
      restart_policy:
        condition: any
        delay: 5s
        max_attempts: 0
        window: 120s

  databridge-postgresql:
    networks:
      - traefik-public
      - platform
    depends_on:
      - postgres
    secrets:
      - source: databridge_pg_password
        target: ${ENV}_databridge_pg_password
    deploy:
      labels:
        - traefik.enable=true
        - traefik.http.routers.${ENV}-databridge-pg-secure.entrypoints=websecure
        - traefik.http.routers.${ENV}-databridge-pg-secure.rule=Host(`databridge-pg.${INDUSTREAM_DOMAIN}`)
        - traefik.http.routers.${ENV}-databridge-pg-secure.tls=true
        - traefik.http.routers.${ENV}-databridge-pg-secure.service=${ENV}-databridge-pg
        - traefik.http.routers.${ENV}-databridge-pg-secure.middlewares=allow-iframe@file
        - traefik.http.routers.${ENV}-databridge-pg.entrypoints=web
        - traefik.http.routers.${ENV}-databridge-pg.rule=Host(`databridge-pg.${INDUSTREAM_DOMAIN}`)
        - traefik.http.routers.${ENV}-databridge-pg.middlewares=redirect-to-https@file
        - traefik.http.services.${ENV}-databridge-pg.loadbalancer.server.port=8080
      resources:
        limits:   { cpus: '0.5', memory: 256M }
        reservations: { cpus: '0.08', memory: 128M }
      restart_policy:
        condition: any
        delay: 5s
        max_attempts: 0
        window: 120s

  databridge-timescaledb:
    networks:
      - traefik-public
      - platform
    secrets:
      - source: timescaledb_password
        target: ${ENV}_timescaledb_password
    deploy:
      labels:
        - traefik.enable=true
        - traefik.http.routers.${ENV}-databridge-tsdb-secure.entrypoints=websecure
        - traefik.http.routers.${ENV}-databridge-tsdb-secure.rule=Host(`databridge-tsdb.${INDUSTREAM_DOMAIN}`)
        - traefik.http.routers.${ENV}-databridge-tsdb-secure.tls=true
        - traefik.http.routers.${ENV}-databridge-tsdb-secure.service=${ENV}-databridge-tsdb
        - traefik.http.routers.${ENV}-databridge-tsdb-secure.middlewares=allow-iframe@file
        - traefik.http.routers.${ENV}-databridge-tsdb.entrypoints=web
        - traefik.http.routers.${ENV}-databridge-tsdb.rule=Host(`databridge-tsdb.${INDUSTREAM_DOMAIN}`)
        - traefik.http.routers.${ENV}-databridge-tsdb.middlewares=redirect-to-https@file
        - traefik.http.services.${ENV}-databridge-tsdb.loadbalancer.server.port=8080
      resources:
        limits:   { cpus: '0.5', memory: 256M }
        reservations: { cpus: '0.08', memory: 128M }
      restart_policy:
        condition: any
        delay: 5s
        max_attempts: 0
        window: 120s

secrets:
  influx_admin_password:
    name: ${ENV}_influx_admin_password
    external: true
  influx_admin_token:
    name: ${ENV}_influx_admin_token
    external: true
  timescaledb_password:
    name: ${ENV}_timescaledb_password
    external: true
  databridge_pg_password:
    name: ${ENV}_databridge_pg_password
    external: true
  postgres_admin_password:
    name: ${ENV}_postgres_admin_password
    external: true
  grafana_db_password:
    name: ${ENV}_grafana_db_password
    external: true
  datacatalog_db_password:
    name: ${ENV}_datacatalog_db_password
    external: true

volumes:
  influxdb-data: { name: "${ENV}-influxdb-data" }
  influxdb-config: { name: "${ENV}-influxdb-config" }
  timescaledb-data: { name: "${ENV}-timescaledb-data" }
  postgres-data: { name: "${ENV}-postgres-data" }

networks:
  traefik-public:
    external: true
    name: traefik-shared_traefik-public
  platform:
    name: ${ENV}-platform
    driver: overlay
    attachable: true

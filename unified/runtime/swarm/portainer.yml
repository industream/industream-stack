# =============================================================================
# runtime/swarm/portainer.yml — Swarm overlay for the optional Portainer console.
# =============================================================================
# Owns swarm topology: docker socket mount (manager-pinned, full API for
# management — mode A), data volume, traefik-public network + Traefik route
# (portainer.${INDUSTREAM_DOMAIN} → :9000), and the external admin secret.
# =============================================================================
services:
  portainer:
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer-data:/data
    secrets:
      - source: portainer_admin_password
        target: portainer_admin_password
    networks:
      - traefik-public
    healthcheck:
      test: ["NONE"]
    deploy:
      placement:
        constraints: [node.role == manager]   # the socket lives on the manager
      resources:
        limits: { cpus: "0.5", memory: 256M }
        reservations: { cpus: "0.05", memory: 64M }
      restart_policy:
        condition: any
        delay: 10s
        window: 120s
      labels:
        - traefik.enable=true
        - traefik.http.routers.${ENV}-portainer-secure.entrypoints=websecure
        - traefik.http.routers.${ENV}-portainer-secure.rule=Host(`portainer.${INDUSTREAM_DOMAIN}`)
        - traefik.http.routers.${ENV}-portainer-secure.tls=true
        - traefik.http.routers.${ENV}-portainer-secure.service=${ENV}-portainer
        - traefik.http.routers.${ENV}-portainer-secure.middlewares=allow-iframe@file
        - traefik.http.routers.${ENV}-portainer.entrypoints=web
        - traefik.http.routers.${ENV}-portainer.rule=Host(`portainer.${INDUSTREAM_DOMAIN}`)
        - traefik.http.routers.${ENV}-portainer.middlewares=redirect-to-https@file
        - traefik.http.services.${ENV}-portainer.loadbalancer.server.port=9000

secrets:
  portainer_admin_password:
    name: ${ENV}_portainer_admin_password
    external: true

volumes:
  portainer-data:
    name: ${ENV}-portainer-data

networks:
  traefik-public:
    external: true
    name: traefik-shared_traefik-public

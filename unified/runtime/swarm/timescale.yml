# =============================================================================
# runtime/swarm/timescale.yml — SWARM-only plumbing (deploy:/Traefik labels/
# docker secrets/overlay nets/named volumes). Merged LAST over base/timescale.yml.
# =============================================================================
# Group: timescale (Enterprise-only, opt-in). DB host + secret names/patterns
# come from runtime.swarm.env (consumed by base interpolation), not here.
# =============================================================================
services:
  timescaledb:
    networks:
      - platform
    volumes:
      - timescaledb-data:/var/lib/postgresql/data
    secrets:
      - source: timescaledb_password
        target: ${ENV}_timescaledb_password
    # Sized from the node by scripts/setup/timescaledb-memory.sh on every deploy;
    # timescaledb-tune only ran once, when the volume was created.
    command:
      - postgres
      - -c
      - shared_buffers=${TIMESCALEDB_SHARED_BUFFERS:-256MB}
      - -c
      - effective_cache_size=${TIMESCALEDB_EFFECTIVE_CACHE_SIZE:-768MB}
      - -c
      - max_connections=${TIMESCALEDB_MAX_CONNECTIONS:-100}
    deploy:
      resources:
        limits:   { cpus: "${TIMESCALEDB_CPUS:-2.0}", memory: "${TIMESCALEDB_MEMORY_LIMIT:-1024M}" }
        reservations: { cpus: '0.15', memory: "${TIMESCALEDB_MEMORY_RESERVATION:-256M}" }
      restart_policy:
        condition: any
        delay: 5s
        max_attempts: 0
        window: 120s

  databridge-timescaledb:
    networks:
      - traefik-public
      - platform
    secrets:
      - source: timescaledb_password
        target: ${ENV}_timescaledb_password
    deploy:
      labels:
        - traefik.enable=true
        - traefik.http.routers.${ENV}-databridge-tsdb-secure.entrypoints=websecure
        - traefik.http.routers.${ENV}-databridge-tsdb-secure.rule=Host(`databridge-tsdb.${INDUSTREAM_DOMAIN}`)
        - traefik.http.routers.${ENV}-databridge-tsdb-secure.tls=true
        - traefik.http.routers.${ENV}-databridge-tsdb-secure.service=${ENV}-databridge-tsdb
        - traefik.http.routers.${ENV}-databridge-tsdb-secure.middlewares=allow-iframe@file
        - traefik.http.routers.${ENV}-databridge-tsdb.entrypoints=web
        - traefik.http.routers.${ENV}-databridge-tsdb.rule=Host(`databridge-tsdb.${INDUSTREAM_DOMAIN}`)
        - traefik.http.routers.${ENV}-databridge-tsdb.middlewares=redirect-to-https@file
        - traefik.http.services.${ENV}-databridge-tsdb.loadbalancer.server.port=8080
      resources:
        limits:   { cpus: '0.5', memory: 256M }
        reservations: { cpus: '0.08', memory: 128M }
      restart_policy:
        condition: any
        delay: 5s
        max_attempts: 0
        window: 120s

secrets:
  timescaledb_password:
    name: ${ENV}_timescaledb_password
    external: true

volumes:
  timescaledb-data: { name: "${ENV}-timescaledb-data" }

networks:
  traefik-public:
    external: true
    name: traefik-shared_traefik-public
  platform:
    name: ${ENV}-platform
    driver: overlay
    attachable: true

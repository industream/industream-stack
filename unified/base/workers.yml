  # ==========================================
  # PREMIUM WORKERS (enterprise → ENTERPRISE_REGISTRY)
  # Gated behind PRODUCT_DATACATALOG entitlement at deploy time.
  # ==========================================
  worker-opc-ua-client:
    <<: *worker
    image: ${ENTERPRISE_REGISTRY}/flowmaker.boxes/opc-ua-client:${WORKER_OPC_UA_CLIENT_VERSION}

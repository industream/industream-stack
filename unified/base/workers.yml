      FM_WORKER_TRANSPORT_ADV_ADDRESS: tcp://worker-postgres-client:5560

  worker-timeseries:
    <<: *worker
    image: ${COMMUNITY_REGISTRY}/flowmaker.boxes/timeseries-workers:${WORKER_TIMESERIES_VERSION}
    environment:
      <<: *worker-env
      FM_WORKER_ID: worker-timeseries001
      FM_WORKER_TRANSPORT_ADV_ADDRESS: tcp://worker-timeseries:5560

  worker-influx-client-dc:
    <<: *worker
    image: ${COMMUNITY_REGISTRY}/flowmaker.boxes/influx-client:${WORKER_INFLUX_CLIENT_VERSION}
    environment:
      <<: *worker-env
      FM_WORKER_ID: worker-influx-client-dc001
      FM_WORKER_TRANSPORT_ADV_ADDRESS: tcp://worker-influx-client-dc:5560

  worker-notifications:
    <<: *worker
    image: ${COMMUNITY_REGISTRY}/flowmaker.boxes/notification:${WORKER_NOTIFICATIONS_VERSION}
    environment:
      <<: *worker-env
      FM_WORKER_ID: worker-notifications001
      FM_WORKER_TRANSPORT_ADV_ADDRESS: tcp://worker-notifications:5560

  # ==========================================
  # INDUSTRIAL PROTOCOL WORKERS (community)
  # ==========================================
  worker-mqtt-client:
    <<: *worker
    image: ${COMMUNITY_REGISTRY}/flowmaker.boxes/mqtt-client:${WORKER_MQTT_CLIENT_VERSION}
    environment:
      <<: *worker-env

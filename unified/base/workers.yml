# =============================================================================
# base/workers.yml — orchestrator-neutral (image + functional env only).
# =============================================================================
# The flow-box worker fleet. Runnable as-is under plain `docker compose` when
# merged with a runtime overlay. Carries NO deploy:/labels/secrets-backend/
# net-names — the runtime.<swarm|compose>.yml overlay owns those.
#
# RECONCILIATION (swarm docker-stack.workers* vs compose docker-compose.workers):
#   - SHORT image names ONLY (flowmaker.boxes/<x>) — the compose tree's
#     `flow-box-<x>` long names are WRONG and dropped here.
#   - Each worker is a full-ref bundle var ${WORKER_*_IMAGE}, NO inline `:-default`
#     — a missing var must fail loudly, never pull a stale tag. The bundle
#     (scripts/render-bundles.sh) resolves the registry license-aware at
#     generation: community workers → COMMUNITY_REGISTRY (anonymous GHCR), the 4
#     premium (opc-ua / rtsp / luminosity / minio-sink) → ENTERPRISE_REGISTRY.
#   - Shared worker shape via the x-worker YAML anchor (FM_WORKER_ID / RUNTIME /
#     ROUTER / LOG / CDN / DATACATALOG_URL, tcp://*:5560).
#
# Functional defaults (`:-`) are allowed for non-image, non-password env only —
# CDN + DataCatalog service URLs. Image tags + passwords never carry defaults.
# =============================================================================

# --- shared worker shape -----------------------------------------------------
# Every flow-box worker speaks the same scheduler/logging/router/CDN contract.
# FM_WORKER_ID and FM_WORKER_TRANSPORT_ADV_ADDRESS are per-worker and set on
# each service via `<<: *worker` + a service-local `environment` (compose merges
# the two environment maps).
x-worker: &worker
  environment: &worker-env
    FM_RUNTIME_HTTP_ADDRESS: http://flowmaker-scheduler:3120
    FM_ROUTER_TRANSPORT_ADDRESS: tcp://*:5560
    FM_WORKER_LOG_SOCKET_IO_ENDPOINT: http://flowmaker-logging:3000
    FM_CDN_REGISTRY_URL: ${CDN_REGISTRY_URL:-http://cdn-server:4873}
  # NOTE: no `depends_on: flowmaker-scheduler/-logging` here — those services
  # live in the core group, not this file. Cross-group start ordering is a
  # full-stack-compose concern; a per-group render must stay self-contained.

services:
  # ==========================================
  # CORE WORKERS (community → COMMUNITY_REGISTRY)
  # ==========================================
  worker-data-logger:
    <<: *worker
    image: ${WORKER_DATA_LOGGER_IMAGE}
    environment:
      <<: *worker-env
      FM_WORKER_ID: worker-data-logger001
      FM_WORKER_TRANSPORT_ADV_ADDRESS: tcp://worker-data-logger:5560

  worker-timer:
    <<: *worker
    image: ${WORKER_TIMER_IMAGE}
    environment:
      <<: *worker-env
      FM_WORKER_ID: worker-timer001
      FM_WORKER_TRANSPORT_ADV_ADDRESS: tcp://worker-timer:5560

  worker-js-expression:
    <<: *worker
    image: ${WORKER_JS_EXPRESSION_IMAGE}
    environment:
      <<: *worker-env
      FM_WORKER_ID: worker-js-expression001
      FM_WORKER_TRANSPORT_ADV_ADDRESS: tcp://worker-js-expression:5560
      FM_CDN_URL: ${CDN_URL:-http://cdn-cache:8080}

  worker-http-client:
    <<: *worker
    image: ${WORKER_HTTP_IMAGE}
    environment:
      <<: *worker-env
      FM_WORKER_ID: worker-http-client001
      FM_WORKER_TRANSPORT_ADV_ADDRESS: tcp://worker-http-client:5560

  worker-postgres-client:
    <<: *worker
    image: ${WORKER_POSTGRES_CLIENT_IMAGE}
    environment:
      <<: *worker-env
      FM_WORKER_ID: worker-postgres-client001
      FM_WORKER_TRANSPORT_ADV_ADDRESS: tcp://worker-postgres-client:5560

  worker-timeseries:
    <<: *worker
    image: ${WORKER_TIMESERIES_IMAGE}
    environment:
      <<: *worker-env
      FM_WORKER_ID: worker-timeseries001
      FM_WORKER_TRANSPORT_ADV_ADDRESS: tcp://worker-timeseries:5560

  worker-influx-client-dc:
    <<: *worker
    image: ${WORKER_INFLUX_CLIENT_IMAGE}
    environment:
      <<: *worker-env
      FM_WORKER_ID: worker-influx-client-dc001
      FM_WORKER_TRANSPORT_ADV_ADDRESS: tcp://worker-influx-client-dc:5560

  worker-notifications:
    <<: *worker
    image: ${WORKER_NOTIFICATIONS_IMAGE}
    environment:
      <<: *worker-env
      FM_WORKER_ID: worker-notifications001
      FM_WORKER_TRANSPORT_ADV_ADDRESS: tcp://worker-notifications:5560

  # ==========================================
  # INDUSTRIAL PROTOCOL WORKERS (community)
  # ==========================================
  worker-mqtt-client:
    <<: *worker
    image: ${WORKER_MQTT_CLIENT_IMAGE}
    environment:
      <<: *worker-env
      FM_WORKER_ID: worker-mqtt-client001
      FM_WORKER_TRANSPORT_ADV_ADDRESS: tcp://worker-mqtt-client:5560

  worker-modbus-tcp:
    <<: *worker
    image: ${WORKER_MODBUS_TCP_IMAGE}
    environment:
      <<: *worker-env
      FM_WORKER_ID: worker-modbus-tcp001
      FM_WORKER_TRANSPORT_ADV_ADDRESS: tcp://worker-modbus-tcp:5560

  worker-test-data-generator:
    <<: *worker
    image: ${WORKER_TEST_DATA_GENERATOR_IMAGE}
    environment:
      <<: *worker-env
      FM_WORKER_ID: worker-test-data-generator001
      FM_WORKER_TRANSPORT_ADV_ADDRESS: tcp://worker-test-data-generator:5560

  worker-conditional-validator:
    <<: *worker
    image: ${WORKER_CONDITIONAL_DATASET_VALIDATOR_IMAGE}
    environment:
      <<: *worker-env
      FM_WORKER_ID: worker-conditional-validator001
      FM_WORKER_TRANSPORT_ADV_ADDRESS: tcp://worker-conditional-validator:5560

  worker-enqueue:
    <<: *worker
    image: ${WORKER_ENQUEUE_IMAGE}
    environment:
      <<: *worker-env
      FM_WORKER_ID: worker-js-enqueue001
      FM_WORKER_TRANSPORT_ADV_ADDRESS: tcp://worker-enqueue:5560

  equation-solver:
    <<: *worker
    image: ${WORKER_EQUATION_SOLVER_IMAGE}
    environment:
      <<: *worker-env
      FM_WORKER_ID: worker-eqsolver001
      FM_WORKER_TRANSPORT_ADV_ADDRESS: tcp://equation-solver:5560

  worker-datacatalog-mapper:
    <<: *worker
    image: ${WORKER_DATACATALOG_MAPPER_IMAGE}
    environment:
      <<: *worker-env
      FM_WORKER_ID: worker-datacatalog-mapper001
      FM_WORKER_TRANSPORT_ADV_ADDRESS: tcp://worker-datacatalog-mapper:5560

  # ==========================================
  # PREMIUM WORKERS (enterprise → ENTERPRISE_REGISTRY) moved out to the
  # Enterprise-only, opt-in `workers-premium` group: base/workers-premium.yml +
  # runtime/<swarm|compose>/workers-premium.yml. deploy.sh gates that group on
  # --edition ee (see the EE-only-group gate). This keeps a CE deploy — on BOTH
  # runtimes — from ever assembling the 4 premium workers.
  # ==========================================

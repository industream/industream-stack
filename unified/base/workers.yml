    environment:
      <<: *worker-env
      FM_WORKER_ID: worker-js-enqueue001
      FM_WORKER_TRANSPORT_ADV_ADDRESS: tcp://worker-enqueue:5560

  equation-solver:
    <<: *worker
    image: ${COMMUNITY_REGISTRY}/flowmaker.boxes/equation-solver:${WORKER_EQUATION_SOLVER_VERSION}

# =============================================================================
# base/workers.yml — orchestrator-neutral (image + functional env only).
# =============================================================================
# The flow-box worker fleet. Runnable as-is under plain `docker compose` when
# merged with a runtime overlay. Carries NO deploy:/labels/secrets-backend/
# net-names — the runtime.<swarm|compose>.yml overlay owns those.
#
# RECONCILIATION (swarm docker-stack.workers* vs compose docker-compose.workers):
#   - SHORT image names ONLY (flowmaker.boxes/<x>) — the compose tree's
#     `flow-box-<x>` long names are WRONG and dropped here.
#   - Tags ONLY from versions.env (WORKER_*_VERSION), NO inline `:-default` —
#     a missing var must fail loudly, never pull a stale tag.
#   - Shared worker shape via the x-worker YAML anchor (FM_WORKER_ID / RUNTIME /
#     ROUTER / LOG / CDN / DATACATALOG_URL, tcp://*:5560).
#   - community workers  → COMMUNITY_REGISTRY (anonymous GHCR).
#   - the 4 premium (opc-ua / rtsp / luminosity / minio-sink) → ENTERPRISE_REGISTRY.
#
# Functional defaults (`:-`) are allowed for non-image, non-password env only —
# CDN + DataCatalog service URLs. Image tags + passwords never carry defaults.
# =============================================================================

# --- shared worker shape -----------------------------------------------------
# Every flow-box worker speaks the same scheduler/logging/router/CDN contract.
# FM_WORKER_ID and FM_WORKER_TRANSPORT_ADV_ADDRESS are per-worker and set on
# each service via `<<: *worker` + a service-local `environment` (compose merges
# the two environment maps).
x-worker: &worker
  environment: &worker-env
    FM_RUNTIME_HTTP_ADDRESS: http://flowmaker-scheduler:3120
    FM_ROUTER_TRANSPORT_ADDRESS: tcp://*:5560
    FM_WORKER_LOG_SOCKET_IO_ENDPOINT: http://flowmaker-logging:3000
    FM_CDN_REGISTRY_URL: ${CDN_REGISTRY_URL:-http://cdn-server:4873}
    FM_DATACATALOG_URL: ${DATACATALOG_URL:-http://datacatalog-api:8080}
  # NOTE: no `depends_on: flowmaker-scheduler/-logging` here — those services
  # live in the core group, not this file. Cross-group start ordering is a
  # full-stack-compose concern; a per-group render must stay self-contained.

services:
  # ==========================================
  # CORE WORKERS (community → COMMUNITY_REGISTRY)
  # ==========================================
  worker-data-logger:
    <<: *worker
    image: ${COMMUNITY_REGISTRY}/flowmaker.boxes/data-logger:${WORKER_DATA_LOGGER_VERSION}
    environment:
      <<: *worker-env
      FM_WORKER_ID: worker-data-logger001
      FM_WORKER_TRANSPORT_ADV_ADDRESS: tcp://worker-data-logger:5560

  worker-timer:
    <<: *worker
    image: ${COMMUNITY_REGISTRY}/flowmaker.boxes/timer:${WORKER_TIMER_VERSION}
    environment:
      <<: *worker-env
      FM_WORKER_ID: worker-timer001
      FM_WORKER_TRANSPORT_ADV_ADDRESS: tcp://worker-timer:5560

  worker-js-expression:
    <<: *worker
    image: ${COMMUNITY_REGISTRY}/flowmaker.boxes/js-expression:${WORKER_JS_EXPRESSION_VERSION}
    environment:
      <<: *worker-env
      FM_WORKER_ID: worker-js-expression001
      FM_WORKER_TRANSPORT_ADV_ADDRESS: tcp://worker-js-expression:5560
      FM_CDN_URL: ${CDN_URL:-http://cdn-cache:8080}

  worker-http-client:
    <<: *worker
    image: ${COMMUNITY_REGISTRY}/flowmaker.boxes/http:${WORKER_HTTP_VERSION}
    environment:
      <<: *worker-env
      FM_WORKER_ID: worker-http-client001
      FM_WORKER_TRANSPORT_ADV_ADDRESS: tcp://worker-http-client:5560

  worker-postgres-client:

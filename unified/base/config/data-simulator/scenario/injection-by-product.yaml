# IOList §8 — By-product injection
section: Injection
topic_prefix: ironstream/injection/byproduct-3

default_tags:
  Id: 3
  Type: ByProduct

value_generators:
  eachTuyere:
    range:
      from: 1
      to: 30

streams:
  - name: temperature
    topic: Temperature
    interval_s: 1.0
    baseline: 80
    drift_per_tick: 0.3
    min: 20
    max: 200

  - name: flowRate
    topic: FlowRate
    interval_s: 1.0
    tags:
      TuyereNo: { value_generator: eachTuyere }
    baseline: 3
    drift_per_tick: 0.05
    min: 0
    max: 10

  # Realistic by-products (recycled sludges, slag fines) split as a few
  # oxides + carbonates; everything else stays at 0 to honour the IOList
  # contract without being noisy. Tweak when integrating a real by-product.
  - name: chemicalProps.C
    topic: C
    interval_s: 600.0
    baseline: 5
    drift_per_tick: 0.1
    min: 0
    max: 100


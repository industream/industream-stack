# data-simulator telegraf — MQTT (ironstream/#) → InfluxDB bucket "IronStream".
# Recovered from the live .55 Portainer stack (data-simulator). Adapted for the
# unified topology: the MQTT broker service is `data-simulator-mosquitto`, and the
# output org is the platform org (${INFLUX_ORG}) so DataBridge (which reads that
# org) exposes the `IronStream` bucket as a queryable database. Create the bucket
# once: influx bucket create -n IronStream -o <org>.
[agent]
  interval = "1s"
  flush_interval = "1s"
  omit_hostname = true

[[inputs.mqtt_consumer]]
  servers = ["tcp://data-simulator-mosquitto:1883"]
  topics = ["ironstream/#"]
  data_format = "influx"
  topic_tag = ""

[[outputs.influxdb_v2]]
  urls = ["${INFLUX_URL}"]
  token = "${INFLUX_TOKEN}"
  organization = "${INFLUX_ORG}"
  bucket = "IronStream"
  insecure_skip_verify = true

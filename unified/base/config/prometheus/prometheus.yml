global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'industream-swarm'
    environment: 'demo'

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093
      timeout: 10s

# Load alert rules
rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Node Exporter for host metrics
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        regex: '([^:]+)(:[0-9]+)?'
        replacement: '${1}'

  # Docker Engine metrics (Swarm services, tasks, nodes)
  - job_name: 'docker'
    static_configs:
      - targets: ['host.docker.internal:9323']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'docker-engine'

  # cAdvisor for container metrics
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        regex: '([^:]+)(:[0-9]+)?'
        replacement: '${1}'
    metric_relabel_configs:
      # Extract service name from image path (e.g. registry/project/image-name:tag -> image-name)
      - source_labels: [image]
        regex: '.*/([^:]+):?.*'
        target_label: container_service
        replacement: '${1}'

  # Grafana
  - job_name: 'grafana'
    static_configs:
      - targets: ['grafana:3000']
    metrics_path: '/metrics'

  # InfluxDB
  - job_name: 'influxdb'
    static_configs:
      - targets: ['influxdb:8086']
    metrics_path: '/metrics'

  # Alertmanager
  - job_name: 'alertmanager'
    static_configs:
      - targets: ['alertmanager:9093']
    metrics_path: '/metrics'

  # Traefik metrics
  - job_name: 'traefik'
    static_configs:
      - targets: ['traefik:8080']
    metrics_path: '/metrics'

  # PostgreSQL Exporter
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']
    metrics_path: '/metrics'

  # Keycloak metrics (if enabled)
  - job_name: 'keycloak'
    static_configs:
      - targets: ['keycloak:8080']
    metrics_path: '/auth/realms/master/metrics'
    scheme: http

  # FlowMaker Scheduler - Metrics on port 3120 (runtime API)
  - job_name: 'flowmaker-scheduler'
    static_configs:
      - targets: ['flowmaker-scheduler:3120']
    metrics_path: '/metrics'
    scrape_interval: 10s

  # FlowMaker Workers - Metrics via labels for cAdvisor filtering
  # Note: Worker-specific metrics (OPC-UA, S7, Modbus) are exposed via the scheduler
  # Container metrics are collected via cAdvisor with name=~"flowmaker-worker.*"

  # Optional: Direct worker metrics (if workers expose /metrics endpoint)
  # Uncomment and configure port if workers support Prometheus metrics
  # - job_name: 'flowmaker-workers'
  #   dns_sd_configs:
  #     - names:
  #         - 'tasks.flowmaker-worker-opc-ua-client'
  #         - 'tasks.flowmaker-worker-s7-client'
  #         - 'tasks.flowmaker-worker-modbus-tcp'
  #       type: 'A'
  #       port: 9090
  #   metrics_path: '/metrics'

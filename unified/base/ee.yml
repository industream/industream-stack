services:
  industream-hub-backend:
    image: ${HUB_API_ENTERPRISE_IMAGE}
    environment:
    - IH_AUTH_METHOD=OAUTH
    - IH_OIDC_ISSUER=https://auth.${INDUSTREAM_DOMAIN}/oidc
    - IH_OIDC_BACKEND_ISSUER_URL=${OIDC_BACKEND_ISSUER_URL:-http://logto:3001/oidc}
    - IH_OIDC_CLIENT_ID=${OIDC_CLIENT_ID}
    - IH_OIDC_CLIENT_SECRET=${OIDC_CLIENT_SECRET:-}
    - IH_OIDC_AUDIENCE=${OIDC_AUDIENCE:-}
    - IH_OIDC_SCOPES=${OIDC_SCOPES:-openid profile email roles offline_access}
    - IH_OIDC_JWKS_URI=${OIDC_JWKS_URI:-http://logto:3001/oidc/jwks}
    - IH_OIDC_USERINFO_URI=${OIDC_USERINFO_URI:-http://logto:3001/oidc/me}
    - IH_OIDC_INTROSPECTION_URL=${OIDC_INTROSPECTION_URL:-http://logto:3001/oidc/token/introspection}
    - IH_OIDC_REDIRECT_URI=https://${INDUSTREAM_DOMAIN}/
    - IH_OIDC_REFRESH_GRANT_ENABLED=${OIDC_REFRESH_GRANT_ENABLED:-true}
    - IH_REVOCATION_CHECK_INTERVAL_SECONDS=${IH_REVOCATION_CHECK_INTERVAL_SECONDS:-300}
    - IH_REVOCATION_HARD_FAIL_AFTER_SECONDS=${IH_REVOCATION_HARD_FAIL_AFTER_SECONDS:-900}
  industream-hub-frontend:
    environment:
    - AUTH_METHOD=OAUTH
    - OIDC_ISSUER=https://auth.${INDUSTREAM_DOMAIN}/oidc
    - OIDC_CLIENT_ID=${OIDC_CLIENT_ID}
    - OIDC_SCOPES=${OIDC_SCOPES:-openid email profile roles offline_access}
    - OIDC_REDIRECT_PATH=${OIDC_REDIRECT_PATH:-/}
  logto:
    image: ghcr.io/logto-io/logto:${LOGTO_VERSION}
    entrypoint:
    - sh
    - -c
    - export DB_URL=$$(cat /run/secrets/${LOGTO_DB_URL_SECRET_NAME}) && (npm run cli db seed -- --swe || true) && npm run cli db alteration deploy latest && npm start
    environment:
    - TRUST_PROXY_HEADER=1
    - ENDPOINT=https://auth.${INDUSTREAM_DOMAIN}
    - ADMIN_ENDPOINT=https://auth-admin.${INDUSTREAM_DOMAIN}
    healthcheck:
      test:
      - CMD-SHELL
      - nc -z 127.0.0.1 3001 || exit 1
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
  logto-postgres:
    image: postgres:${POSTGRES_VERSION}
    environment:
    - POSTGRES_USER=postgres
    - POSTGRES_DB=logto
    - POSTGRES_PASSWORD_FILE=/run/secrets/${LOGTO_DB_PASSWORD_SECRET_NAME}
    - PGDATA=/var/lib/postgresql/data/pgdata
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U postgres -d logto || exit 1
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
  grafana:
    deploy:
      labels:
      - io.industream.logto.register=true
      - io.industream.logto.client_id=grafana
      - io.industream.logto.redirect_uri=https://dashboard.${INDUSTREAM_DOMAIN}/grafana/login/generic_oauth
      - io.industream.logto.app_type=Traditional
      - io.industream.logto.name=Grafana
    environment:
    - GF_AUTH_JWT_ENABLED=false
    - GF_AUTH_JWT_URL_LOGIN=false
    - GF_AUTH_JWT_ENABLE_LOGIN_TOKEN=false
    - GF_AUTH_GENERIC_OAUTH_ENABLED=true
    - GF_AUTH_GENERIC_OAUTH_NAME=Industream
    - GF_AUTH_GENERIC_OAUTH_CLIENT_ID=grafana
    - GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET=${GRAFANA_OIDC_CLIENT_SECRET}
    - GF_AUTH_GENERIC_OAUTH_SCOPES=openid profile email roles
    - GF_AUTH_GENERIC_OAUTH_AUTH_URL=https://auth.${INDUSTREAM_DOMAIN}/oidc/auth
    - GF_AUTH_GENERIC_OAUTH_TOKEN_URL=https://auth.${INDUSTREAM_DOMAIN}/oidc/token
    - GF_AUTH_GENERIC_OAUTH_API_URL=https://auth.${INDUSTREAM_DOMAIN}/oidc/me
    - GF_AUTH_GENERIC_OAUTH_LOGIN_ATTRIBUTE_PATH=username
    - GF_AUTH_GENERIC_OAUTH_EMAIL_ATTRIBUTE_PATH=email
    - GF_AUTH_GENERIC_OAUTH_NAME_ATTRIBUTE_PATH=name
    - GF_AUTH_GENERIC_OAUTH_AUTO_SIGN_UP=true
    - GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH=contains(roles, 'admin') && 'Admin' || 'Editor'
    - GF_AUTH_GENERIC_OAUTH_AUTO_LOGIN=true
    - GF_AUTH_DISABLE_SIGNOUT_MENU=true
    - GF_AUTH_GENERIC_OAUTH_TLS_SKIP_VERIFY_INSECURE=true
    - GF_SECURITY_COOKIE_SAMESITE=none
    - GF_SECURITY_COOKIE_SECURE=true
    - GF_LIVE_MAX_CONNECTIONS=100
    - GF_SECURITY_CSRF_TRUSTED_ORIGINS=${INDUSTREAM_DOMAIN} dashboard.${INDUSTREAM_DOMAIN}
    - GF_LIVE_ALLOWED_ORIGINS=https://${INDUSTREAM_DOMAIN},https://dashboard.${INDUSTREAM_DOMAIN}
  grafana-wrapper:
    environment:
    - INDUSTREAM_OIDC_ORIGIN=https://auth.${INDUSTREAM_DOMAIN}

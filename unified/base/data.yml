# =============================================================================
# base/data.yml — orchestrator-neutral (image + functional env only).
# =============================================================================
# Group: data — postgres, influxdb, databridge (influx + postgresql variants).
#
# NOTE: the TimescaleDB backend (timescaledb + databridge-timescaledb) lives in
# its own Enterprise-only, opt-in group: base/timescale.yml. It is NOT part of
# the always-on `data` group. CE deploys use InfluxDB.
#
# Carries NO deploy:/labels/secrets-backend/net-names/volumes — the
# runtime.<swarm|compose>.yml overlay owns those. Runnable as-is under plain
# `docker compose` only when merged with a runtime overlay.
#
# Secret/token resolution is identical on both runtimes via the mounted
# entrypoint scripts:
#   - influxdb-entrypoint.sh   finds /run/secrets/*_influx_admin_{password,token}
#   - dotnet-entrypoint.sh     finds /run/secrets/*_${DB_SECRET_PATTERN} and
#     replaces __DB_PASSWORD_PLACEHOLDER__ / __INFLUX_TOKEN_PLACEHOLDER__.
# The base NEVER inlines an image tag (versions.env) or a password (placeholder).
#
# The databridge (influx variant) is the timeseries API talking to InfluxDB; the
# -postgresql / -timescaledb variants are the same image pointed at a SQL store.
# DATABRIDGE_*_DB_HOST differs per topology (shared `postgres` on swarm vs a
# dedicated DB on compose) and is supplied by runtime.<runtime>.env interpolation.
# =============================================================================
services:
  # ---------------------------------------------------------------------------
  # PostgreSQL — shared relational store for DataCatalog, Grafana (dashboard)
  # and the DataBridge (postgresql variant). The mounted init-postgres.sh parses
  # POSTGRES_MULTIPLE_DATABASES (db:user:FROM_SECRET) and idempotently
  # reconciles each user/db, reading the per-user password from the matching
  # /run/secrets/*_<pattern> file. Init runs ONLY on the first volume init
  # (docker-entrypoint-initdb.d); rerun manually after rotating a secret.
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:${POSTGRES_VERSION}
    hostname: postgres
    environment:
      - POSTGRES_USER=${POSTGRES_ADMIN_USER}
      - POSTGRES_PASSWORD_FILE=/run/secrets/${POSTGRES_ADMIN_PASSWORD_SECRET_NAME}
      - POSTGRES_MULTIPLE_DATABASES=industream:dashboard:FROM_SECRET,DataCatalog:datacatalog:FROM_SECRET,DataBridge:databridge:FROM_SECRET
      # Pin PGDATA inside the mounted volume (Postgres 18+ moved the default).
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - ./config/postgres-init/init-postgres.sh:/docker-entrypoint-initdb.d/init-postgres.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_ADMIN_USER} -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ---------------------------------------------------------------------------
  # InfluxDB — time-series store. Token/password injected by entrypoint from the
  # mounted secrets (names resolved by the runtime overlay's secret backend).
  # ---------------------------------------------------------------------------
  influxdb:
    image: influxdb:${INFLUXDB_VERSION}
    entrypoint: ["/bin/sh", "/scripts/influxdb-entrypoint.sh"]
    command: ["influxd"]
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=${INFLUX_ADMIN_USERNAME}
      - DOCKER_INFLUXDB_INIT_ORG=${INFLUX_ORG}
      - DOCKER_INFLUXDB_INIT_BUCKET=${INFLUX_BUCKET}
      - INFLUXD_REPORTING_DISABLED=true
      # InfluxDB 2.8+: store API tokens hashed on disk. MUST be set before the
      # initial setup runs — not reversible without wiping the data volume.
      - INFLUXD_USE_HASHED_TOKENS=true
    volumes:
      - ./config/influxdb-entrypoint.sh:/scripts/influxdb-entrypoint.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "influx ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ---------------------------------------------------------------------------
  # DataBridge (InfluxDB variant) — timeseries API over InfluxDB.
  # ---------------------------------------------------------------------------
  databridge:
    image: ${DATABRIDGE_API_IMAGE}
    entrypoint: ["/bin/sh", "/scripts/dotnet-entrypoint.sh"]
    command: ["dotnet", "/app/Industream.DataBridge.Api.dll"]
    environment:
      - InfluxDB__Connection__Url=http://influxdb:8086
      # Replaced at startup by dotnet-entrypoint.sh from the mounted influx token
      # secret — same mechanism on swarm (docker secret) and compose (file secret).
      - InfluxDB__Connection__Token=__INFLUX_TOKEN_PLACEHOLDER__
      - InfluxDB__Connection__Organization=${INFLUX_ORG}
    volumes:
      - ./config/dotnet-entrypoint.sh:/scripts/dotnet-entrypoint.sh:ro
    depends_on:
      - influxdb
    healthcheck:
      # /health endpoint was removed in DataBridge 2.x — fall back to swagger probe.
      test: ["CMD-SHELL", "wget --spider -qS http://localhost:8080/swagger 2>&1 | grep -qE 'HTTP/1.. (200|301|302)' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ---------------------------------------------------------------------------
  # DataBridge (PostgreSQL variant) — same image, SQL store. DB host differs per
  # topology (shared `postgres` on swarm / dedicated on compose) via runtime env.
  # ---------------------------------------------------------------------------
  databridge-postgresql:
    image: ${DATABRIDGE_API_IMAGE}
    entrypoint: ["/bin/sh", "/scripts/dotnet-entrypoint.sh"]
    command: ["dotnet", "/app/Industream.DataBridge.Api.dll"]
    environment:
      # dotnet-entrypoint.sh matches /run/secrets/*_${DB_SECRET_PATTERN} and
      # replaces __DB_PASSWORD_PLACEHOLDER__ in the connection string below.
      - DB_SECRET_PATTERN=${DATABRIDGE_PG_DB_SECRET_PATTERN}
      - PostgreSql__ConnectionString=Server=${DATABRIDGE_PG_DB_HOST};Port=5432;User Id=${DATABRIDGE_PG_DB_USER};Password=__DB_PASSWORD_PLACEHOLDER__;Database=${DATABRIDGE_PG_DB_NAME};
    volumes:
      - ./config/dotnet-entrypoint.sh:/scripts/dotnet-entrypoint.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -qS http://localhost:8080/swagger 2>&1 | grep -qE 'HTTP/1.. (200|301|302)' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

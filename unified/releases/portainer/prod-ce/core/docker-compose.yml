networks:
  platform:
    external: true
    name: ${ENV}-platform
  traefik-public:
    external: true
    name: traefik-shared_traefik-public
secrets:
  hub_jwt_signing_key:
    external: true
    name: ${ENV}_hub_jwt_signing_key
  minio_root_password:
    external: true
    name: ${MINIO_ROOT_PASSWORD_SECRET_NAME}
  minio_root_user:
    external: true
    name: ${MINIO_ROOT_USER_SECRET_NAME}
services:
  cdn-cache:
    deploy:
      labels:
      - traefik.enable=true
      - traefik.http.routers.${ENV}-cdn-cache.rule=Host(`cdn.${INDUSTREAM_DOMAIN}`)
      - traefik.http.routers.${ENV}-cdn-cache.entrypoints=websecure
      - traefik.http.routers.${ENV}-cdn-cache.tls=true
      - traefik.http.services.${ENV}-cdn-cache.loadbalancer.server.port=8080
      - traefik.http.routers.${ENV}-cdn-cache-http.rule=Host(`cdn.${INDUSTREAM_DOMAIN}`)
      - traefik.http.routers.${ENV}-cdn-cache-http.entrypoints=web
      mode: replicated
      replicas: 1
      resources:
        limits:
          cpus: '1.0'
          memory: 128M
        reservations:
          cpus: '0.08'
          memory: 64M
      restart_policy:
        condition: any
        delay: 5s
        max_attempts: 5
        window: 120s
    environment:
    - ESMPORT=8080
    - NPM_REGISTRY=http://cdn-server:4873
    hostname: cdn-cache
    image: ${CDN_CACHE_IMAGE}
    networks:
      platform: null
      traefik-public: null
    volumes:
    - source: cdn-cache-storage
      target: /esm/.cache
      type: volume
      volume: {}
  cdn-server:
    deploy:
      mode: replicated
      replicas: 1
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
        reservations:
          cpus: '0.03'
          memory: 64M
      restart_policy:
        condition: any
        delay: 5s
        max_attempts: 5
        window: 120s
    hostname: cdn-server
    image: ${CDN_SERVER_IMAGE}
    networks:
      platform: null
    volumes:
    - source: cdn-server-storage
      target: /verdaccio/storage
      type: volume
      volume: {}
  industream-hub-backend:
    deploy:
      labels:
      - traefik.enable=true
      - traefik.http.routers.${ENV}-industream-hub-backend-secure.entrypoints=websecure
      - traefik.http.routers.${ENV}-industream-hub-backend-secure.rule=Host(`${INDUSTREAM_DOMAIN}`)
        && PathPrefix(`/api/uifusion`)
      - traefik.http.routers.${ENV}-industream-hub-backend-secure.tls=true
      - traefik.http.routers.${ENV}-industream-hub-backend-secure.service=${ENV}-industream-hub-backend
      - traefik.http.routers.${ENV}-industream-hub-backend-secure.middlewares=${ENV}-industream-hub-backend-stripprefix,security-headers@file
      - traefik.http.routers.${ENV}-industream-hub-backend.entrypoints=web
      - traefik.http.routers.${ENV}-industream-hub-backend.rule=Host(`${INDUSTREAM_DOMAIN}`)
        && PathPrefix(`/api/uifusion`)
      - traefik.http.routers.${ENV}-industream-hub-backend.middlewares=redirect-to-https@file
      - traefik.http.middlewares.${ENV}-industream-hub-backend-stripprefix.stripprefix.prefixes=/api/uifusion
      - traefik.http.services.${ENV}-industream-hub-backend.loadbalancer.server.port=3050
      - traefik.http.routers.${ENV}-industream-hub-uploads-secure.entrypoints=websecure
      - traefik.http.routers.${ENV}-industream-hub-uploads-secure.rule=Host(`${INDUSTREAM_DOMAIN}`)
        && PathPrefix(`/api/uploads`)
      - traefik.http.routers.${ENV}-industream-hub-uploads-secure.tls=true
      - traefik.http.routers.${ENV}-industream-hub-uploads-secure.service=${ENV}-industream-hub-backend
      - traefik.http.routers.${ENV}-industream-hub-uploads-secure.middlewares=security-headers@file
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.03'
          memory: 64M
      restart_policy:
        condition: any
        delay: 5s
        max_attempts: 0
        window: 120s
    environment:
    - CONFIG_PATH=/app/data/config.json
    - IH_PUBLIC_PORT=3050
    - IH_INTERNAL_PORT=3051
    - IH_AUTH_METHOD=${IH_AUTH_METHOD:-BASIC}
    - IH_USERNAME=${HUB_BACKEND_ADMIN_USER:-admin}
    - IH_PASSWORD=${HUB_BACKEND_ADMIN_PASSWORD:-admin}
    - IH_EMAIL=admin@${INDUSTREAM_DOMAIN:-localhost}
    - IH_FIRSTNAME=Admin
    - IH_LASTNAME=User
    - IH_ROLE=admin
    - IH_ACCOUNT_NAME=industream
    - IH_ISSUER=${HUB_AUTH_ISSUER}
    - IH_AUDIENCE=${HUB_AUTH_AUDIENCE}
    - IH_JWT_SIGNING_KEY_FILE=/run/secrets/hub_jwt_signing_key
    - IH_ACCESS_TOKEN_TTL_SECONDS=900
    - IH_REFRESH_TOKEN_TTL_SECONDS=2592000
    - IH_BACKEND_ORIGIN=${INDUSTREAM_HUB_ORIGIN}
    - HUB_DATA_PATH=/app/data/hub
    healthcheck:
      interval: 30s
      retries: 3
      start_period: 15s
      test:
      - CMD
      - wget
      - --no-verbose
      - --tries=1
      - --spider
      - http://localhost:3050/auth/jwks
      timeout: 3s
    image: ${HUB_API_IMAGE}
    networks:
      platform:
        aliases:
        - industream-hub-backend
      traefik-public: {}
    secrets:
    - source: hub_jwt_signing_key
      target: hub_jwt_signing_key
    volumes:
    - source: industream-hub-config
      target: /app/data
      type: volume
      volume: {}
  industream-hub-frontend:
    deploy:
      labels:
      - traefik.enable=true
      - traefik.http.routers.${ENV}-industream-hub-frontend-ui-secure.entrypoints=websecure
      - traefik.http.routers.${ENV}-industream-hub-frontend-ui-secure.rule=Host(`${INDUSTREAM_DOMAIN}`)
        && !PathPrefix(`/auth`) && !PathPrefix(`/api/uifusion`)
      - traefik.http.routers.${ENV}-industream-hub-frontend-ui-secure.tls=true
      - traefik.http.routers.${ENV}-industream-hub-frontend-ui-secure.service=${ENV}-industream-hub-frontend-ui
      - traefik.http.routers.${ENV}-industream-hub-frontend-ui-secure.middlewares=allow-iframe@file
      - traefik.http.routers.${ENV}-industream-hub-frontend-ui.entrypoints=web
      - traefik.http.routers.${ENV}-industream-hub-frontend-ui.rule=Host(`${INDUSTREAM_DOMAIN}`)
        && !PathPrefix(`/auth`) && !PathPrefix(`/api/uifusion`)
      - traefik.http.routers.${ENV}-industream-hub-frontend-ui.middlewares=redirect-to-https@file
      - traefik.http.services.${ENV}-industream-hub-frontend-ui.loadbalancer.server.port=80
      resources:
        limits:
          cpus: '0.5'
          memory: 128M
        reservations:
          cpus: '0.03'
          memory: 32M
      restart_policy:
        condition: any
        delay: 5s
        max_attempts: 0
        window: 120s
    environment:
    - NODE_ENV=production
    - HUB_BACKEND_URL=${INDUSTREAM_HUB_ORIGIN}/api/uifusion
    - DATACATALOG_URL=https://datacatalog-api.${INDUSTREAM_DOMAIN}
    - BRIDGE_PATH=/shared-worker.html
    healthcheck:
      interval: 30s
      retries: 3
      start_period: 20s
      test:
      - CMD-SHELL
      - nc -z 127.0.0.1 80 || exit 1
      timeout: 10s
    image: ${HUB_UI_IMAGE}
    networks:
      platform: null
      traefik-public: null
  minio:
    command: server /data --console-address ":9001"
    deploy:
      labels:
      - traefik.enable=true
      - traefik.http.routers.${ENV}-minio-api-secure.entrypoints=websecure
      - traefik.http.routers.${ENV}-minio-api-secure.rule=Host(`s3.${INDUSTREAM_DOMAIN}`)
      - traefik.http.routers.${ENV}-minio-api-secure.tls=true
      - traefik.http.routers.${ENV}-minio-api-secure.service=${ENV}-minio-api
      - traefik.http.routers.${ENV}-minio-api-secure.middlewares=security-headers@file
      - traefik.http.services.${ENV}-minio-api.loadbalancer.server.port=9000
      - traefik.http.routers.${ENV}-minio-console-secure.entrypoints=websecure
      - traefik.http.routers.${ENV}-minio-console-secure.rule=Host(`minio.${INDUSTREAM_DOMAIN}`)
      - traefik.http.routers.${ENV}-minio-console-secure.tls=true
      - traefik.http.routers.${ENV}-minio-console-secure.service=${ENV}-minio-console
      - traefik.http.services.${ENV}-minio-console.loadbalancer.server.port=9001
      - traefik.http.middlewares.${ENV}-minio-headers.headers.contentsecuritypolicy=frame-ancestors
        'self' https://${INDUSTREAM_DOMAIN} https://*.${INDUSTREAM_DOMAIN}
      - traefik.http.routers.${ENV}-minio-console-secure.middlewares=${ENV}-minio-headers,allow-iframe@file
      resources:
        limits:
          cpus: '1.0'
          memory: 768M
        reservations:
          cpus: '0.08'
          memory: 256M
      restart_policy:
        condition: any
        delay: 5s
        max_attempts: 0
        window: 120s
    environment:
    - MINIO_ROOT_USER_FILE=/run/secrets/${MINIO_ROOT_USER_SECRET_NAME}
    - MINIO_ROOT_PASSWORD_FILE=/run/secrets/${MINIO_ROOT_PASSWORD_SECRET_NAME}
    healthcheck:
      interval: 30s
      retries: 3
      start_period: 30s
      test:
      - CMD-SHELL
      - mc ready local || exit 1
      timeout: 10s
    hostname: minio
    image: minio/minio:${MINIO_VERSION}
    networks:
      platform: null
      traefik-public: null
    secrets:
    - source: minio_root_user
      target: ${MINIO_ROOT_USER_SECRET_NAME}
    - source: minio_root_password
      target: ${MINIO_ROOT_PASSWORD_SECRET_NAME}
    volumes:
    - source: minio-data
      target: /data
      type: volume
      volume: {}
volumes:
  cdn-cache-storage:
    name: ${ENV}-cdn-cache-storage
  cdn-server-storage:
    name: ${ENV}-cdn-server-storage
  industream-hub-config:
    name: ${ENV}-industream-hub-config
  minio-data:
    name: ${ENV}-minio-data

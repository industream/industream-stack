networks:
  platform:
    external: true
    name: ${ENV}-platform
  traefik-public:
    external: true
    name: traefik-shared_traefik-public
secrets:
  databridge_pg_password:
    external: true
    name: ${ENV}_databridge_pg_password
  datacatalog_db_password:
    external: true
    name: ${ENV}_datacatalog_db_password
  grafana_db_password:
    external: true
    name: ${ENV}_grafana_db_password
  influx_admin_password:
    external: true
    name: ${ENV}_influx_admin_password
  influx_admin_token:
    external: true
    name: ${ENV}_influx_admin_token
  postgres_admin_password:
    external: true
    name: ${ENV}_postgres_admin_password
services:
  databridge:
    command:
    - dotnet
    - /app/Industream.DataBridge.Api.dll
    depends_on:
      influxdb:
        condition: service_started
        required: true
    deploy:
      labels:
      - traefik.enable=true
      - traefik.http.routers.${ENV}-databridge-secure.entrypoints=websecure
      - traefik.http.routers.${ENV}-databridge-secure.rule=Host(`databridge.${INDUSTREAM_DOMAIN}`)
      - traefik.http.routers.${ENV}-databridge-secure.tls=true
      - traefik.http.routers.${ENV}-databridge-secure.service=${ENV}-databridge
      - traefik.http.routers.${ENV}-databridge-secure.middlewares=allow-iframe@file
      - traefik.http.routers.${ENV}-databridge.entrypoints=web
      - traefik.http.routers.${ENV}-databridge.rule=Host(`databridge.${INDUSTREAM_DOMAIN}`)
      - traefik.http.routers.${ENV}-databridge.middlewares=redirect-to-https@file
      - traefik.http.middlewares.${ENV}-databridge-stripprefix.stripprefix.prefixes=/api/databridge
      - traefik.http.services.${ENV}-databridge.loadbalancer.server.port=8080
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.08'
          memory: 128M
      restart_policy:
        condition: any
        delay: 5s
        max_attempts: 0
        window: 120s
    entrypoint:
    - /bin/sh
    - /scripts/dotnet-entrypoint.sh
    environment:
    - InfluxDB__Connection__Url=http://influxdb:8086
    - InfluxDB__Connection__Token=__INFLUX_TOKEN_PLACEHOLDER__
    - InfluxDB__Connection__Organization=${INFLUX_ORG}
    healthcheck:
      interval: 30s
      retries: 3
      start_period: 30s
      test:
      - CMD-SHELL
      - wget --spider -qS http://localhost:8080/swagger 2>&1 | grep -qE 'HTTP/1..
        (200|301|302)' || exit 1
      timeout: 10s
    image: ${DATABRIDGE_API_IMAGE}
    networks:
      platform: null
      traefik-public: null
    secrets:
    - source: influx_admin_token
      target: ${ENV}_influx_admin_token
    volumes:
    - bind:
        create_host_path: true
      read_only: true
      source: /tmp/iw-port/unified/base/config/dotnet-entrypoint.sh
      target: /scripts/dotnet-entrypoint.sh
      type: bind
  databridge-postgresql:
    command:
    - dotnet
    - /app/Industream.DataBridge.Api.dll
    depends_on:
      postgres:
        condition: service_started
        required: true
    deploy:
      labels:
      - traefik.enable=true
      - traefik.http.routers.${ENV}-databridge-pg-secure.entrypoints=websecure
      - traefik.http.routers.${ENV}-databridge-pg-secure.rule=Host(`databridge-pg.${INDUSTREAM_DOMAIN}`)
      - traefik.http.routers.${ENV}-databridge-pg-secure.tls=true
      - traefik.http.routers.${ENV}-databridge-pg-secure.service=${ENV}-databridge-pg
      - traefik.http.routers.${ENV}-databridge-pg-secure.middlewares=allow-iframe@file
      - traefik.http.routers.${ENV}-databridge-pg.entrypoints=web
      - traefik.http.routers.${ENV}-databridge-pg.rule=Host(`databridge-pg.${INDUSTREAM_DOMAIN}`)
      - traefik.http.routers.${ENV}-databridge-pg.middlewares=redirect-to-https@file
      - traefik.http.services.${ENV}-databridge-pg.loadbalancer.server.port=8080
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.08'
          memory: 128M
      restart_policy:
        condition: any
        delay: 5s
        max_attempts: 0
        window: 120s
    entrypoint:
    - /bin/sh
    - /scripts/dotnet-entrypoint.sh
    environment:
    - DB_SECRET_PATTERN=${DATABRIDGE_PG_DB_SECRET_PATTERN}
    - PostgreSql__ConnectionString=Server=${DATABRIDGE_PG_DB_HOST};Port=5432;User
      Id=${DATABRIDGE_PG_DB_USER};Password=__DB_PASSWORD_PLACEHOLDER__;Database=${DATABRIDGE_PG_DB_NAME};
    healthcheck:
      interval: 30s
      retries: 3
      start_period: 30s
      test:
      - CMD-SHELL
      - wget --spider -qS http://localhost:8080/swagger 2>&1 | grep -qE 'HTTP/1..
        (200|301|302)' || exit 1
      timeout: 10s
    image: ${DATABRIDGE_API_IMAGE}
    networks:
      platform: null
      traefik-public: null
    secrets:
    - source: databridge_pg_password
      target: ${ENV}_databridge_pg_password
    volumes:
    - bind:
        create_host_path: true
      read_only: true
      source: /tmp/iw-port/unified/base/config/dotnet-entrypoint.sh
      target: /scripts/dotnet-entrypoint.sh
      type: bind
  influxdb:
    command:
    - influxd
    deploy:
      labels:
      - traefik.enable=true
      - traefik.http.routers.${ENV}-influxdb-secure.entrypoints=websecure
      - traefik.http.routers.${ENV}-influxdb-secure.rule=Host(`influxdb.${INDUSTREAM_DOMAIN}`)
      - traefik.http.routers.${ENV}-influxdb-secure.tls=true
      - traefik.http.routers.${ENV}-influxdb-secure.service=${ENV}-influxdb
      - traefik.http.routers.${ENV}-influxdb-secure.middlewares=allow-iframe@file
      - traefik.http.services.${ENV}-influxdb.loadbalancer.server.port=8086
      resources:
        limits:
          cpus: '2.0'
          memory: 768M
        reservations:
          cpus: '0.15'
          memory: 256M
      restart_policy:
        condition: any
        delay: 5s
        max_attempts: 0
        window: 120s
    entrypoint:
    - /bin/sh
    - /scripts/influxdb-entrypoint.sh
    environment:
    - DOCKER_INFLUXDB_INIT_MODE=setup
    - DOCKER_INFLUXDB_INIT_USERNAME=${INFLUX_ADMIN_USERNAME}
    - DOCKER_INFLUXDB_INIT_ORG=${INFLUX_ORG}
    - DOCKER_INFLUXDB_INIT_BUCKET=${INFLUX_BUCKET}
    - INFLUXD_REPORTING_DISABLED=true
    - INFLUXD_USE_HASHED_TOKENS=true
    healthcheck:
      interval: 30s
      retries: 3
      start_period: 60s
      test:
      - CMD-SHELL
      - influx ping
      timeout: 10s
    image: influxdb:${INFLUXDB_VERSION}
    networks:
      platform: null
      traefik-public: null
    secrets:
    - source: influx_admin_password
      target: ${ENV}_influx_admin_password
    - source: influx_admin_token
      target: ${ENV}_influx_admin_token
    volumes:
    - bind:
        create_host_path: true
      read_only: true
      source: /tmp/iw-port/unified/base/config/influxdb-entrypoint.sh
      target: /scripts/influxdb-entrypoint.sh
      type: bind
    - source: influxdb-data
      target: /var/lib/influxdb2
      type: volume
      volume: {}
    - source: influxdb-config
      target: /etc/influxdb2
      type: volume
      volume: {}
  postgres:
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M
        reservations:
          cpus: '0.08'
          memory: 512M
      restart_policy:
        condition: any
        delay: 5s
        max_attempts: 0
        window: 120s
    environment:
    - POSTGRES_USER=${POSTGRES_ADMIN_USER}
    - POSTGRES_PASSWORD_FILE=/run/secrets/${POSTGRES_ADMIN_PASSWORD_SECRET_NAME}
    - POSTGRES_MULTIPLE_DATABASES=industream:dashboard:FROM_SECRET,DataCatalog:datacatalog:FROM_SECRET,DataBridge:databridge:FROM_SECRET
    - PGDATA=/var/lib/postgresql/data/pgdata
    healthcheck:
      interval: 10s
      retries: 5
      start_period: 30s
      test:
      - CMD-SHELL
      - pg_isready -U ${POSTGRES_ADMIN_USER} -d postgres
      timeout: 5s
    hostname: postgres
    image: postgres:${POSTGRES_VERSION}
    networks:
      platform: null
    secrets:
    - source: postgres_admin_password
      target: ${ENV}_postgres_admin_password
    - source: grafana_db_password
      target: ${ENV}_grafana_db_password
    - source: datacatalog_db_password
      target: ${ENV}_datacatalog_db_password
    - source: databridge_pg_password
      target: ${ENV}_databridge_pg_password
    volumes:
    - bind:
        create_host_path: true
      read_only: true
      source: /tmp/iw-port/unified/base/config/postgres-init/init-postgres.sh
      target: /docker-entrypoint-initdb.d/init-postgres.sh
      type: bind
    - source: postgres-data
      target: /var/lib/postgresql/data
      type: volume
      volume: {}
volumes:
  influxdb-config:
    name: ${ENV}-influxdb-config
  influxdb-data:
    name: ${ENV}-influxdb-data
  postgres-data:
    name: ${ENV}-postgres-data

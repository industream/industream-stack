# =============================================================================
# runtime.swarm.yml — SWARM-only plumbing (deploy:/Traefik labels/docker secrets/
# overlay nets). Merged LAST over base/*.yml. Owns everything orchestrator-specific.
# =============================================================================
# Increment 1 covers datacatalog only; the rest of the services land as the base
# is extracted (Phase 2-3). The dotnet-entrypoint reads the password from
# /run/secrets/<DB_SECRET_NAME> — same path compose uses, so the base is shared.
# =============================================================================
services:
  datacatalog-api:
    # DB host + secret name come from runtime.swarm.env (consumed by base
    # interpolation), not here.
    volumes:
      - ./config/dotnet-entrypoint.sh:/scripts/dotnet-entrypoint.sh:ro
    networks:
      - traefik-public
      - platform
    depends_on:
      - postgres
    secrets:
      - source: datacatalog_db_password
        target: ${ENV}_datacatalog_db_password
      - source: datacatalog_api_key
        target: ${ENV}_datacatalog_api_key
    deploy:
      labels:
        - traefik.enable=true
        - traefik.http.routers.${ENV}-datacatalog-api-secure.entrypoints=websecure
        - traefik.http.routers.${ENV}-datacatalog-api-secure.rule=Host(`datacatalog.${INDUSTREAM_DOMAIN}`) || Host(`datacatalog-api.${INDUSTREAM_DOMAIN}`)
        - traefik.http.routers.${ENV}-datacatalog-api-secure.tls=true
        - traefik.http.routers.${ENV}-datacatalog-api-secure.service=${ENV}-datacatalog-api
        - traefik.http.routers.${ENV}-datacatalog-api-secure.middlewares=allow-iframe@file
        - traefik.http.services.${ENV}-datacatalog-api.loadbalancer.server.port=8002
      resources:
        limits:   { cpus: '0.5', memory: 256M }
        reservations: { cpus: '0.08', memory: 128M }

  datacatalog-ui:
    networks:
      - traefik-public
      - platform
    deploy:
      labels:
        - traefik.enable=true
        - traefik.http.routers.${ENV}-datacatalog-ui-secure.entrypoints=websecure
        - traefik.http.routers.${ENV}-datacatalog-ui-secure.rule=Host(`datacatalog-ui.${INDUSTREAM_DOMAIN}`)
        - traefik.http.routers.${ENV}-datacatalog-ui-secure.tls=true
        - traefik.http.routers.${ENV}-datacatalog-ui-secure.service=${ENV}-datacatalog-ui
        - traefik.http.routers.${ENV}-datacatalog-ui-secure.middlewares=allow-iframe@file
        - traefik.http.services.${ENV}-datacatalog-ui.loadbalancer.server.port=8080

secrets:
  datacatalog_db_password:
    name: ${ENV}_datacatalog_db_password
    external: true
  datacatalog_api_key:
    name: ${ENV}_datacatalog_api_key
    external: true

networks:
  traefik-public:
    external: true
    name: traefik-shared_traefik-public
  platform:
    name: ${ENV}-platform
    driver: overlay
    attachable: true

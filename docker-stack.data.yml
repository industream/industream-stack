# =============================================================================
# INDUSTREAM PLATFORM - DATA SERVICES
# =============================================================================
# InfluxDB, TimescaleDB, SQL Server, DataCatalog, DataBridge APIs
# =============================================================================
# Multi-environment support: Use ${ENV} prefix for isolation
# Example: ENV=prod docker stack deploy ...
# =============================================================================

services:
  # ==========================================
  # INFLUXDB
  # ==========================================
  influxdb:
    image: influxdb:${INFLUXDB_VERSION:-2.7.12}
    entrypoint: ["/bin/sh", "/scripts/influxdb-entrypoint.sh"]
    command: ["influxd"]
    environment:
    - DOCKER_INFLUXDB_INIT_MODE=setup
    - DOCKER_INFLUXDB_INIT_USERNAME=${INFLUX_ADMIN_USERNAME:-admin}
    - DOCKER_INFLUXDB_INIT_ORG=${INFLUX_ORG:-industream}
    - DOCKER_INFLUXDB_INIT_BUCKET=${INFLUX_BUCKET:-test}
    - INFLUXD_REPORTING_DISABLED=true
    volumes:
    - ${ENV}-influxdb-data:/var/lib/influxdb2
    - ${ENV}-influxdb-config:/etc/influxdb2
    - ./config/influxdb-entrypoint.sh:/scripts/influxdb-entrypoint.sh:ro
    networks:
    - traefik-public
    - ${ENV}-platform
    secrets:
    - ${ENV}_influx_admin_password
    - ${ENV}_influx_admin_token
    healthcheck:
      test:
      - CMD-SHELL
      - influx ping
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      labels:
      - traefik.enable=true
      - traefik.http.routers.${ENV}-influxdb-secure.entrypoints=websecure
      - traefik.http.routers.${ENV}-influxdb-secure.rule=Host(`influxdb.${INDUSTREAM_DOMAIN:-localhost}`)
      - traefik.http.routers.${ENV}-influxdb-secure.tls=true
      - traefik.http.routers.${ENV}-influxdb-secure.service=${ENV}-influxdb
      - traefik.http.services.${ENV}-influxdb.loadbalancer.server.port=8086
      resources:
        limits:
          cpus: '2.0'
          memory: 768M
        reservations:
          cpus: '0.15'
          memory: 256M
      restart_policy:
        condition: any
        delay: 5s
        max_attempts: 0
        window: 120s

  # ==========================================
  # DATABRIDGE API
  # ==========================================
  databridge:
    image: ${DOCKER_REGISTRY:-842775dh.c1.gra9.container-registry.ovh.net}/timeseries/api:${DATABRIDGE_API_VERSION:-1.0.0-alpha.4}
    entrypoint: ["/bin/sh", "/scripts/dotnet-entrypoint.sh"]
    command: ["dotnet", "/app/Industream.Timeseries.Api.dll"]
    environment:
    - InfluxDB__Connection__Url=http://influxdb:8086
    - InfluxDB__Connection__Token=__INFLUX_TOKEN_PLACEHOLDER__
    - InfluxDB__Connection__Organization=${INFLUX_ORG:-industream}
    volumes:
    - ./config/dotnet-entrypoint.sh:/scripts/dotnet-entrypoint.sh:ro
    networks:
    - traefik-public
    - ${ENV}-platform
    secrets:
    - ${ENV}_influx_admin_token
    depends_on:
    - influxdb
    healthcheck:
      test: ["NONE"]
    deploy:
      labels:
      - traefik.enable=true
      - traefik.http.routers.${ENV}-databridge-secure.entrypoints=websecure
      - traefik.http.routers.${ENV}-databridge-secure.rule=Host(`databridge.${INDUSTREAM_DOMAIN:-localhost}`)
      - traefik.http.routers.${ENV}-databridge-secure.tls=true
      - traefik.http.routers.${ENV}-databridge-secure.service=${ENV}-databridge
      - traefik.http.routers.${ENV}-databridge-secure.middlewares=
      - traefik.http.routers.${ENV}-databridge.entrypoints=web
      - traefik.http.routers.${ENV}-databridge.rule=Host(`databridge.${INDUSTREAM_DOMAIN:-localhost}`)
      - traefik.http.routers.${ENV}-databridge.middlewares=redirect-to-https@file
      - traefik.http.middlewares.${ENV}-databridge-stripprefix.stripprefix.prefixes=/api/databridge
      - traefik.http.services.${ENV}-databridge.loadbalancer.server.port=8080
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.08'
          memory: 128M
      restart_policy:
        condition: any
        delay: 5s
        max_attempts: 0
        window: 120s

  # ==========================================
  # DATACATALOG API
  # ==========================================
  datacatalog-api:
    image: ${DOCKER_REGISTRY:-842775dh.c1.gra9.container-registry.ovh.net}/datacatalog/api:${DATACATALOG_API_VERSION:-1.0.0}
    entrypoint: ["/bin/sh", "/scripts/dotnet-entrypoint.sh"]
    command: ["dotnet", "/app/Industream.DataCatalog.Api.dll"]
    environment:
    - DB_SECRET_NAME=${ENV}_datacatalog_db_password
    - PostgreSql__ConnectionString=Server=postgres;Port=5432;User Id=${DATACATALOG_DB_USER:-datacatalog};Password=__DB_PASSWORD_PLACEHOLDER__;Database=${DATACATALOG_DB_NAME:-DataCatalog};
    - Database__MigrateOnStartup=false
    volumes:
    - ./config/dotnet-entrypoint.sh:/scripts/dotnet-entrypoint.sh:ro
    networks:
    - traefik-public
    - ${ENV}-platform
    depends_on:
    - postgres
    secrets:
    - ${ENV}_datacatalog_db_password
    healthcheck:
      test:
      - CMD-SHELL
      - wget --no-verbose --tries=1 --spider http://127.0.0.1:8080/health || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      labels:
      - traefik.enable=true
      - traefik.http.routers.${ENV}-datacatalog-api-secure.entrypoints=websecure
      - traefik.http.routers.${ENV}-datacatalog-api-secure.rule=Host(`datacatalog.${INDUSTREAM_DOMAIN:-localhost}`) || Host(`datacatalog-api.${INDUSTREAM_DOMAIN:-localhost}`)
      - traefik.http.routers.${ENV}-datacatalog-api-secure.tls=true
      - traefik.http.routers.${ENV}-datacatalog-api-secure.service=${ENV}-datacatalog-api
      - traefik.http.routers.${ENV}-datacatalog-api-secure.middlewares=
      - traefik.http.routers.${ENV}-datacatalog-api.entrypoints=web
      - traefik.http.routers.${ENV}-datacatalog-api.rule=Host(`datacatalog.${INDUSTREAM_DOMAIN:-localhost}`) || Host(`datacatalog-api.${INDUSTREAM_DOMAIN:-localhost}`)
      - traefik.http.routers.${ENV}-datacatalog-api.middlewares=redirect-to-https@file
      - traefik.http.middlewares.${ENV}-datacatalog-api-stripprefix.stripprefix.prefixes=/api/datacatalog
      - traefik.http.services.${ENV}-datacatalog-api.loadbalancer.server.port=8080
      - traefik.http.routers.${ENV}-datacatalog-api-ui-proxy.entrypoints=websecure
      - traefik.http.routers.${ENV}-datacatalog-api-ui-proxy.rule=Host(`datacatalog-ui.${INDUSTREAM_DOMAIN:-localhost}`) && PathPrefix(`/api/`)
      - traefik.http.routers.${ENV}-datacatalog-api-ui-proxy.tls=true
      - traefik.http.routers.${ENV}-datacatalog-api-ui-proxy.service=${ENV}-datacatalog-api
      - traefik.http.routers.${ENV}-datacatalog-api-ui-proxy.middlewares=${ENV}-datacatalog-api-strip-api
      - traefik.http.middlewares.${ENV}-datacatalog-api-strip-api.stripprefix.prefixes=/api
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.08'
          memory: 128M
      restart_policy:
        condition: any
        delay: 5s
        max_attempts: 0
        window: 120s

  # ==========================================
  # TIMESCALEDB
  # ==========================================
  timescaledb:
    image: timescale/timescaledb:${TIMESCALEDB_VERSION:-latest-pg17}
    environment:
    - POSTGRES_USER=${TIMESCALEDB_ADMIN_USER:-postgres}
    - POSTGRES_PASSWORD_FILE=/run/secrets/${ENV}_timescaledb_password
    - POSTGRES_DB=industream
    volumes:
    - ${ENV}-timescaledb-data:/var/lib/postgresql/data
    networks:
    - ${ENV}-platform
    secrets:
    - ${ENV}_timescaledb_password
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U ${TIMESCALEDB_ADMIN_USER:-postgres} -d industream
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1024M
        reservations:
          cpus: '0.15'
          memory: 256M
      restart_policy:
        condition: any
        delay: 5s
        max_attempts: 0
        window: 120s

  # ==========================================
  # DATABRIDGE API - POSTGRESQL
  # ==========================================
  databridge-postgresql:
    image: ${DOCKER_REGISTRY:-842775dh.c1.gra9.container-registry.ovh.net}/timeseries/api:${DATABRIDGE_API_VERSION:-1.0.0-alpha.4}
    entrypoint: ["/bin/sh", "/scripts/dotnet-entrypoint.sh"]
    command: ["dotnet", "/app/Industream.Timeseries.Api.dll"]
    environment:
    - DB_SECRET_PATTERN=databridge_pg_password
    - PostgreSql__ConnectionString=Server=postgres;Port=5432;User Id=${DATABRIDGE_PG_DB_USER:-databridge};Password=__DB_PASSWORD_PLACEHOLDER__;Database=${DATABRIDGE_PG_DB_NAME:-DataBridge};
    volumes:
    - ./config/dotnet-entrypoint.sh:/scripts/dotnet-entrypoint.sh:ro
    networks:
    - traefik-public
    - ${ENV}-platform
    depends_on:
    - postgres
    secrets:
    - ${ENV}_databridge_pg_password
    healthcheck:
      test: ["NONE"]
    deploy:
      labels:
      - traefik.enable=true
      - traefik.http.routers.${ENV}-databridge-pg-secure.entrypoints=websecure
      - traefik.http.routers.${ENV}-databridge-pg-secure.rule=Host(`databridge-pg.${INDUSTREAM_DOMAIN:-localhost}`)
      - traefik.http.routers.${ENV}-databridge-pg-secure.tls=true
      - traefik.http.routers.${ENV}-databridge-pg-secure.service=${ENV}-databridge-pg
      - traefik.http.routers.${ENV}-databridge-pg-secure.middlewares=
      - traefik.http.routers.${ENV}-databridge-pg.entrypoints=web
      - traefik.http.routers.${ENV}-databridge-pg.rule=Host(`databridge-pg.${INDUSTREAM_DOMAIN:-localhost}`)
      - traefik.http.routers.${ENV}-databridge-pg.middlewares=redirect-to-https@file
      - traefik.http.services.${ENV}-databridge-pg.loadbalancer.server.port=8080
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.08'
          memory: 128M
      restart_policy:
        condition: any
        delay: 5s
        max_attempts: 0
        window: 120s

  # ==========================================
  # DATABRIDGE API - TIMESCALEDB
  # ==========================================
  databridge-timescaledb:
    image: ${DOCKER_REGISTRY:-842775dh.c1.gra9.container-registry.ovh.net}/timeseries/api:${DATABRIDGE_API_VERSION:-1.0.0-alpha.4}
    entrypoint: ["/bin/sh", "/scripts/dotnet-entrypoint.sh"]
    command: ["dotnet", "/app/Industream.Timeseries.Api.dll"]
    environment:
    - DB_SECRET_PATTERN=timescaledb_password
    - PostgreSql__ConnectionString=Server=timescaledb;Port=5432;User Id=${TIMESCALEDB_ADMIN_USER:-postgres};Password=__DB_PASSWORD_PLACEHOLDER__;Database=industream;
    volumes:
    - ./config/dotnet-entrypoint.sh:/scripts/dotnet-entrypoint.sh:ro
    networks:
    - traefik-public
    - ${ENV}-platform
    depends_on:
    - timescaledb
    secrets:
    - ${ENV}_timescaledb_password
    healthcheck:
      test: ["NONE"]
    deploy:
      labels:
      - traefik.enable=true
      - traefik.http.routers.${ENV}-databridge-tsdb-secure.entrypoints=websecure
      - traefik.http.routers.${ENV}-databridge-tsdb-secure.rule=Host(`databridge-tsdb.${INDUSTREAM_DOMAIN:-localhost}`)
      - traefik.http.routers.${ENV}-databridge-tsdb-secure.tls=true
      - traefik.http.routers.${ENV}-databridge-tsdb-secure.service=${ENV}-databridge-tsdb
      - traefik.http.routers.${ENV}-databridge-tsdb-secure.middlewares=
      - traefik.http.routers.${ENV}-databridge-tsdb.entrypoints=web
      - traefik.http.routers.${ENV}-databridge-tsdb.rule=Host(`databridge-tsdb.${INDUSTREAM_DOMAIN:-localhost}`)
      - traefik.http.routers.${ENV}-databridge-tsdb.middlewares=redirect-to-https@file
      - traefik.http.services.${ENV}-databridge-tsdb.loadbalancer.server.port=8080
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.08'
          memory: 128M
      restart_policy:
        condition: any
        delay: 5s
        max_attempts: 0
        window: 120s

  # ==========================================
  # DATACATALOG UI
  # ==========================================
  datacatalog-ui:
    image: ${DOCKER_REGISTRY:-842775dh.c1.gra9.container-registry.ovh.net}/datacatalog/ui:${DATACATALOG_UI_VERSION:-1.0.0}
    environment:
    - NODE_ENV=production
    - DATACATALOG_API_URL=${DATACATALOG_API_URL:-https://datacatalog.${INDUSTREAM_DOMAIN:-localhost}}
    networks:
    - traefik-public
    - ${ENV}-platform
    depends_on:
    - datacatalog-api
    healthcheck:
      test:
      - CMD-SHELL
      - wget -q --spider http://127.0.0.1:80/ || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      labels:
      - traefik.enable=true
      - traefik.http.routers.${ENV}-datacatalog-ui-secure.entrypoints=websecure
      - traefik.http.routers.${ENV}-datacatalog-ui-secure.rule=Host(`datacatalog-ui.${INDUSTREAM_DOMAIN:-localhost}`)
      - traefik.http.routers.${ENV}-datacatalog-ui-secure.tls=true
      - traefik.http.routers.${ENV}-datacatalog-ui-secure.service=${ENV}-datacatalog-ui
      - traefik.http.routers.${ENV}-datacatalog-ui.entrypoints=web
      - traefik.http.routers.${ENV}-datacatalog-ui.rule=Host(`datacatalog-ui.${INDUSTREAM_DOMAIN:-localhost}`)
      - traefik.http.routers.${ENV}-datacatalog-ui.middlewares=redirect-to-https@file
      - traefik.http.services.${ENV}-datacatalog-ui.loadbalancer.server.port=80
      resources:
        limits:
          cpus: '0.1'
          memory: 64M
        reservations:
          cpus: '0.02'
          memory: 32M
      restart_policy:
        condition: any
        delay: 5s
        max_attempts: 0
        window: 120s

# =============================================================================
# NETWORKS
# =============================================================================
networks:
  traefik-public:
    external: true
    name: traefik-shared_traefik-public
  ${ENV}-platform:

# =============================================================================
# VOLUMES
# =============================================================================
volumes:
  ${ENV}-influxdb-data:
  ${ENV}-influxdb-config:
  ${ENV}-timescaledb-data:

# =============================================================================
# SECRETS
# =============================================================================
secrets:
  ${ENV}_influx_admin_password:
    external: true
  ${ENV}_influx_admin_token:
    external: true
  ${ENV}_datacatalog_db_password:
    external: true
  ${ENV}_timescaledb_password:
    external: true
  ${ENV}_databridge_pg_password:
    external: true

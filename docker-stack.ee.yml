# =============================================================================
# Enterprise Edition overlay — Logto (OIDC) on top of the community stack
# =============================================================================
# Deploy:  docker stack deploy -c docker-stack.yml [-c docker-stack.*.yml] \
#                              -c docker-stack.ee.yml ${ENV}
# (deploy-swarm.sh appends this file to STACK_FILES when edition=enterprise.)
#
# The community stack (docker-stack.yml, owned by the CE work) runs the Hub
# backend natively as the `uifusion-api` service in JWKS-only / BASIC mode. This
# overlay turns that single deployment into EE:
#   - swaps `uifusion-api` to the enterprise image (uifusion/api-enterprise) and flips it
#     to OAUTH against a self-hosted Logto;
#   - adds Logto (+ its own Postgres).
#
# CE contracts consumed (do NOT redefine here — the CE stack owns them):
#   - service name `uifusion-api`  = the Hub backend
#   - network alias `industream-hub-backend`, JWKS at :3050/auth/jwks
#   - issuer=hub-backend, audience=industream-hub
# The Hub JWT it MINTS is unchanged (same issuer/audience) → Grafana/FlowMaker
# JWKS verifiers need NO change between CE and EE. Only the identity SOURCE
# changes (internal admin → Logto).
#
# EE wiring required alongside this file (coordinate with the CE scripts):
#   - create-secrets.sh: add `logto_db_password` (+ `logto_cookie_key`) — EE only.
#   - generate-sans.sh:  add `auth.${INDUSTREAM_DOMAIN}` (+ auth-admin) to the cert.
# =============================================================================
services:
  # ---- Override the native Hub backend → enterprise image + OAUTH ------------
  uifusion-api:
    image: ${ENTERPRISE_REGISTRY:-39t88114.c1.gra9.container-registry.ovh.net}/uifusion/api-enterprise:${UIFUSION_API_EE_VERSION:-2.1.0}
    environment:
    - IH_AUTH_METHOD=OAUTH
    # Upstream Logto — issuer/JWKS/userinfo. JWKS+userinfo stay on the INTERNAL
    # overlay network (no TLS, no mixed-content); the issuer is the public URL
    # used for `iss` validation + the browser token exchange.
    - IH_OIDC_ISSUER=${OIDC_ISSUER:-https://auth.${INDUSTREAM_DOMAIN:-localhost}/oidc}
    - IH_OIDC_CLIENT_ID=${OIDC_CLIENT_ID:-industream-hub-app}
    - IH_OIDC_CLIENT_SECRET=${OIDC_CLIENT_SECRET:-}
    - IH_OIDC_AUDIENCE=${OIDC_AUDIENCE:-}
    - IH_OIDC_SCOPES=${OIDC_SCOPES:-openid profile email roles offline_access}
    - IH_OIDC_JWKS_URI=${OIDC_JWKS_URI:-http://logto:3001/oidc/jwks}
    - IH_OIDC_USERINFO_URI=${OIDC_USERINFO_URI:-http://logto:3001/oidc/me}
    - IH_OIDC_REDIRECT_URI=${OIDC_REDIRECT_URI:-https://${INDUSTREAM_DOMAIN:-localhost}/}
    # EE-only: upstream session revocation monitoring (no CE equivalent).
    - IH_OIDC_REFRESH_GRANT_ENABLED=${OIDC_REFRESH_GRANT_ENABLED:-true}
    - IH_REVOCATION_CHECK_INTERVAL_SECONDS=${IH_REVOCATION_CHECK_INTERVAL_SECONDS:-300}
    - IH_REVOCATION_HARD_FAIL_AFTER_SECONDS=${IH_REVOCATION_HARD_FAIL_AFTER_SECONDS:-900}
    - IH_OIDC_INTROSPECTION_URL=${OIDC_INTROSPECTION_URL:-}

  # ---- Logto IdP -------------------------------------------------------------
  logto:
    image: ghcr.io/logto-io/logto:${LOGTO_VERSION:-latest}
    # Logto reads DB_URL from env (no native _FILE convention support); we
    # source the secret file into DB_URL at startup so docker secrets keep
    # the password off the compose file. The CLI seed (idempotent) then runs
    # before the server starts. NOTE: the secret path is hardcoded with
    # ${ENV} (expanded by envsubst in deploy-swarm.sh) — referencing the
    # DB_URL_FILE env var here would be mangled by envsubst at deploy-time
    # (it strips unknown $VAR), so the literal path is used instead.
    entrypoint: ["sh", "-c", "export DB_URL=$(cat /run/secrets/${ENV}_logto_db_url) && npm run cli db seed -- --swe && npm start"]
    environment:
    - TRUST_PROXY_HEADER=1
    - DB_URL_FILE=/run/secrets/${ENV}_logto_db_url
    - ENDPOINT=${LOGTO_ENDPOINT:-https://auth.${INDUSTREAM_DOMAIN:-localhost}}
    - ADMIN_ENDPOINT=${LOGTO_ADMIN_ENDPOINT:-https://auth-admin.${INDUSTREAM_DOMAIN:-localhost}}
    networks:
    - traefik-public
    - ${ENV}-platform
    secrets:
    - ${ENV}_logto_db_url
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 3001 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    deploy:
      labels:
      - traefik.enable=true
      # Public OIDC endpoint (browser-facing — MUST be HTTPS, mixed-content).
      - traefik.http.routers.${ENV}-logto-secure.entrypoints=websecure
      - traefik.http.routers.${ENV}-logto-secure.rule=Host(`auth.${INDUSTREAM_DOMAIN:-localhost}`)
      - traefik.http.routers.${ENV}-logto-secure.tls=true
      - traefik.http.routers.${ENV}-logto-secure.service=${ENV}-logto
      - traefik.http.routers.${ENV}-logto-secure.middlewares=security-headers@file
      - traefik.http.services.${ENV}-logto.loadbalancer.server.port=3001
      - traefik.http.routers.${ENV}-logto.entrypoints=web
      - traefik.http.routers.${ENV}-logto.rule=Host(`auth.${INDUSTREAM_DOMAIN:-localhost}`)
      - traefik.http.routers.${ENV}-logto.middlewares=redirect-to-https@file
      # Admin console (one-time setup / role mgmt) on a sibling host.
      - traefik.http.routers.${ENV}-logto-admin-secure.entrypoints=websecure
      - traefik.http.routers.${ENV}-logto-admin-secure.rule=Host(`auth-admin.${INDUSTREAM_DOMAIN:-localhost}`)
      - traefik.http.routers.${ENV}-logto-admin-secure.tls=true
      - traefik.http.routers.${ENV}-logto-admin-secure.service=${ENV}-logto-admin
      - traefik.http.routers.${ENV}-logto-admin-secure.middlewares=security-headers@file
      - traefik.http.services.${ENV}-logto-admin.loadbalancer.server.port=3002
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.05'
          memory: 128M
      restart_policy:
        condition: any
        delay: 5s
        window: 120s

  logto-postgres:
    image: postgres:17-alpine
    environment:
    - POSTGRES_USER=postgres
    - POSTGRES_DB=logto
    - POSTGRES_PASSWORD_FILE=/run/secrets/${ENV}_logto_db_password
    networks:
    - ${ENV}-platform
    volumes:
    - ${ENV}-logto-postgres-data:/var/lib/postgresql/data
    secrets:
    - ${ENV}_logto_db_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d logto || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.05'
          memory: 64M
      restart_policy:
        condition: any
        delay: 5s
        window: 120s

volumes:
  ${ENV}-logto-postgres-data:

secrets:
  # Logto DB password (plain) + the full DB_URL (so the password never appears in
  # an env string). Both generated by create-secrets.sh in EE mode.
  ${ENV}_logto_db_password:
    external: true
  ${ENV}_logto_db_url:
    external: true

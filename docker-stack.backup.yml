# =============================================================================
# INDUSTREAM PLATFORM - BACKUP SERVICES
# =============================================================================
# Backup scheduler, backup jobs, backup monitor
# =============================================================================
# Multi-environment support: Use ${ENV} prefix for isolation
# Example: ENV=prod docker stack deploy ...
# =============================================================================

services:
  # ==========================================
  # BACKUP SCHEDULER
  # ==========================================
  swarm-cronjob:
    image: crazymax/swarm-cronjob:latest
    environment:
      - TZ=${TZ:-Europe/Berlin}
      - LOG_LEVEL=info
      - LOG_JSON=false
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - ${ENV}-platform
    deploy:
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          cpus: '0.1'
          memory: 64M
        reservations:
          cpus: '0.02'
          memory: 32M
      restart_policy:
        condition: any
        delay: 5s
        max_attempts: 0
        window: 120s

  # ==========================================
  # BACKUP JOBS
  # ==========================================
  backup-postgres:
    image: postgres:${POSTGRES_VERSION:-18-alpine}
    entrypoint: ["/bin/bash", "/scripts/backup-postgres.sh"]
    environment:
      - BACKUP_DIR=/backups/postgres
      - RETENTION_DAYS=${BACKUP_RETENTION_DAYS:-7}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_ADMIN_USER:-postgres}
      - ENV=${ENV:-prod}
      # DATABASES auto-discovered by backup-postgres.sh when unset. Set
      # explicitly (space-separated) to restrict the backup to a subset.
      - NTFY_URL=http://ntfy:80
      - NTFY_TOPIC=${NTFY_TOPIC:-industream-backups}
    volumes:
      - ./scripts/backups/backup-postgres.sh:/scripts/backup-postgres.sh:ro
      - ${ENV}-backup-data:/backups
    networks:
      - ${ENV}-platform
    secrets:
      - ${ENV}_postgres_admin_password
    depends_on:
      - postgres
      - ntfy
    deploy:
      mode: replicated
      replicas: 0
      # Pin to the manager so the `backup-data` volume is shared with
      # backup-monitor (same placement below). On a multi-node swarm this
      # prevents the monitor from seeing an empty local volume.
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
        reservations:
          cpus: '0.03'
          memory: 64M
      restart_policy:
        condition: none
      labels:
        - swarm.cronjob.enable=true
        - swarm.cronjob.schedule=0 2 * * *
        - swarm.cronjob.skip-running=true

  backup-volumes:
    image: alpine:latest
    entrypoint: ["/bin/sh", "/scripts/backup-volumes.sh"]
    environment:
      - BACKUP_DIR=/backups/volumes
      - RETENTION_DAYS=${BACKUP_RETENTION_DAYS:-7}
      # Volume-to-path mapping consumed by backup-volumes.sh. Each *_DATA
      # variable points at a read-only mount of the source volume below.
      - GRAFANA_DATA=/data/grafana
      - MINIO_DATA=/data/minio
      - FLOWMAKER_LAUNCHER_DATA=/data/flowmaker-launcher
      - FLOWMAKER_CONFIGHUB_DATA=/data/flowmaker-confighub
      - NTFY_DATA=/data/ntfy
      - ALERTMANAGER_DATA=/data/alertmanager
      - CDN_SERVER_STORAGE=/data/cdn-server-storage
      - IRONSTREAM_POSTGRES_DATA=/data/ironstream-postgres
      - NTFY_URL=http://ntfy:80
      - NTFY_TOPIC=${NTFY_TOPIC:-industream-backups}
    volumes:
      - ./scripts/backups/backup-volumes.sh:/scripts/backup-volumes.sh:ro
      - ${ENV}-backup-data:/backups
      # Source volumes are mounted read-only so the backup job can never
      # corrupt live data even on script bugs.
      - ${ENV}-grafana-data:/data/grafana:ro
      - ${ENV}-minio-data:/data/minio:ro
      - ${ENV}-flowmaker-launcher-data:/data/flowmaker-launcher:ro
      - ${ENV}-flowmaker-confighub-data:/data/flowmaker-confighub:ro
      - ${ENV}-ntfy-data:/data/ntfy:ro
      - ${ENV}-alertmanager-data:/data/alertmanager:ro
      - ${ENV}-cdn-server-storage:/data/cdn-server-storage:ro
      - ${ENV}-ironstream-postgres-data:/data/ironstream-postgres:ro
    networks:
      - ${ENV}-platform
    depends_on:
      - ntfy
    deploy:
      mode: replicated
      replicas: 0
      # Co-locate with backup-postgres + backup-monitor so the shared
      # backup-data volume is populated on the same node that the monitor
      # reads from.
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
        reservations:
          cpus: '0.03'
          memory: 64M
      restart_policy:
        condition: none
      labels:
        - swarm.cronjob.enable=true
        - swarm.cronjob.schedule=0 4 * * *
        - swarm.cronjob.skip-running=true

  # Profile-gated by deploy-swarm.sh based on TIMESERIES_BACKEND in .env.
  # Only one of (backup-influxdb, backup-timescaledb) is enabled per deploy.
  backup-influxdb:
    profiles: ["ts-influx"]
    image: influxdb:${INFLUXDB_VERSION:-2.9.1}
    entrypoint: ["/bin/bash", "/scripts/backup-influxdb.sh"]
    environment:
      - BACKUP_DIR=/backups/influxdb
      - RETENTION_DAYS=${BACKUP_RETENTION_DAYS:-7}
      - INFLUXDB_HOST=http://influxdb:8086
      - INFLUXDB_ORG=${INFLUXDB_ORG:-industream}
      - NTFY_URL=http://ntfy:80
      - NTFY_TOPIC=${NTFY_TOPIC:-industream-backups}
    volumes:
      - ./scripts/backups/backup-influxdb.sh:/scripts/backup-influxdb.sh:ro
      - ${ENV}-backup-data:/backups
    networks:
      - ${ENV}-platform
    secrets:
      - ${ENV}_influx_admin_token
    depends_on:
      - influxdb
      - ntfy
    deploy:
      mode: replicated
      replicas: 0
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
        reservations:
          cpus: '0.03'
          memory: 128M
      restart_policy:
        condition: none
      labels:
        - swarm.cronjob.enable=true
        - swarm.cronjob.schedule=30 2 * * *
        - swarm.cronjob.skip-running=true

  backup-timescaledb:
    profiles: ["ts-timescale"]
    image: postgres:${POSTGRES_VERSION:-18-alpine}
    entrypoint: ["/bin/bash", "/scripts/backup-timescaledb.sh"]
    environment:
      - BACKUP_DIR=/backups/timeseries
      - RETENTION_DAYS=${BACKUP_RETENTION_DAYS:-7}
      - TIMESCALE_HOST=timescaledb
      - TIMESCALE_PORT=5432
      - TIMESCALE_USER=${TIMESCALEDB_ADMIN_USER:-postgres}
      - TIMESCALE_DB=${TIMESCALE_DB:-industream}
      - PGPASSWORD_FILE=/run/secrets/${ENV}_timescaledb_password
      - NTFY_URL=http://ntfy:80
      - NTFY_TOPIC=${NTFY_TOPIC:-industream-backups}
    volumes:
      - ./scripts/backups/backup-timescaledb.sh:/scripts/backup-timescaledb.sh:ro
      - ${ENV}-backup-data:/backups
    networks:
      - ${ENV}-platform
    secrets:
      - ${ENV}_timescaledb_password
    depends_on:
      - ntfy
    deploy:
      mode: replicated
      replicas: 0
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.05'
          memory: 128M
      restart_policy:
        condition: none
      labels:
        - swarm.cronjob.enable=true
        - swarm.cronjob.schedule=30 2 * * *
        - swarm.cronjob.skip-running=true

  # ==========================================
  # OFF-SITE BACKUP SYNC
  # ==========================================
  # Rsyncs the backup volume to a remote SSH host every day at 05:00 UTC
  # (after all the per-component backup jobs). Profile-gated so the secret
  # is only required when off-site is configured (see .env.example).
  backup-offsite:
    profiles: ["offsite"]
    image: alpine:latest
    entrypoint: ["/bin/sh", "-c", "apk add --no-cache -q openssh-client rsync wget && sh /scripts/offsite-sync.sh"]
    environment:
      - BACKUP_DIR=/backups
      - OFFSITE_ENABLED=${OFFSITE_ENABLED:-false}
      - OFFSITE_HOST=${OFFSITE_HOST:-}
      - OFFSITE_USER=${OFFSITE_USER:-}
      - OFFSITE_PATH=${OFFSITE_PATH:-}
      - OFFSITE_PORT=${OFFSITE_PORT:-22}
      - OFFSITE_BANDWIDTH_KBPS=${OFFSITE_BANDWIDTH_KBPS:-0}
      - OFFSITE_SSH_KEY_FILE=/run/secrets/${ENV}_offsite_ssh_key
      - NTFY_URL=http://ntfy:80
      - NTFY_TOPIC=${NTFY_TOPIC:-industream-backups}
    volumes:
      - ./scripts/backups/offsite-sync.sh:/scripts/offsite-sync.sh:ro
      - ${ENV}-backup-data:/backups:ro
    networks:
      - ${ENV}-platform
    secrets:
      - ${ENV}_offsite_ssh_key
    depends_on:
      - ntfy
    deploy:
      mode: replicated
      replicas: 0
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
        reservations:
          cpus: '0.02'
          memory: 32M
      restart_policy:
        condition: none
      labels:
        - swarm.cronjob.enable=true
        - swarm.cronjob.schedule=0 5 * * *
        - swarm.cronjob.skip-running=true

  # ==========================================
  # WEEKLY BACKUP VERIFICATION
  # ==========================================
  # Walks the backup volume every Sunday at 03:00 UTC and verifies the
  # integrity of every PostgreSQL dump, InfluxDB archive and volume
  # archive produced over the last 7 days. Sends a Ntfy notification on
  # any failure or if no recent backups are found.
  verify-weekly:
    image: postgres:${POSTGRES_VERSION:-18-alpine}
    entrypoint: ["/bin/bash", "/scripts/verify-weekly.sh"]
    environment:
      - BACKUP_DIR=/backups
      - LOG_DIR=/var/log/industream-backups
      - MAX_AGE_DAYS=7
      - NTFY_URL=http://ntfy:80
      - NTFY_TOPIC=${NTFY_TOPIC:-industream-backups}
    volumes:
      - ./scripts/backups/verify-weekly.sh:/scripts/verify-weekly.sh:ro
      - ${ENV}-backup-data:/backups:ro
      - ${ENV}-backup-verify-logs:/var/log/industream-backups
    networks:
      - ${ENV}-platform
    depends_on:
      - ntfy
    deploy:
      mode: replicated
      replicas: 0
      # Must run on the same node that holds the populated backup-data
      # volume, i.e. the manager (see backup-postgres / backup-volumes /
      # backup-influxdb placement above).
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
        reservations:
          cpus: '0.03'
          memory: 64M
      restart_policy:
        condition: none
      labels:
        - swarm.cronjob.enable=true
        - swarm.cronjob.schedule=0 3 * * 0
        - swarm.cronjob.skip-running=true

  # ==========================================
  # BACKUP MONITOR
  # ==========================================
  backup-monitor:
    image: ${ENTERPRISE_REGISTRY:-39t88114.c1.gra9.container-registry.ovh.net}/flowmaker.infra/backup-monitor:1.0.0
    environment:
      - BACKUP_DIR=/backups
      - NODE_ENV=production
      - KEYCLOAK_URL=https://${INDUSTREAM_DOMAIN:-industream.platform.lan}/auth
      - KEYCLOAK_REALM=industream
    volumes:
      - ${ENV}-backup-data:/backups:ro
    networks:
      - traefik-public
      - ${ENV}-platform
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      mode: replicated
      replicas: 1
      # Must sit on the same node as backup-postgres / backup-volumes /
      # backup-influxdb (all pinned to manager) so the monitor sees the
      # populated backup-data volume rather than an empty local copy on a
      # worker node.
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          cpus: '0.25'
          memory: 64M
        reservations:
          cpus: '0.02'
          memory: 32M
      restart_policy:
        condition: any
        delay: 5s
        max_attempts: 0
        window: 120s
      labels:
        - traefik.enable=true
        - traefik.http.routers.${ENV}-backup-monitor-swarm.rule=Host(`backups.${INDUSTREAM_DOMAIN:-localhost}`)
        - traefik.http.routers.${ENV}-backup-monitor-swarm.entrypoints=websecure
        - traefik.http.routers.${ENV}-backup-monitor-swarm.tls=true
        - traefik.http.routers.${ENV}-backup-monitor-swarm.middlewares=backup-ratelimit@file,backup-security-headers@file,allow-iframe@file
        - traefik.http.services.${ENV}-backup-monitor-swarm.loadbalancer.server.port=3000
        - traefik.http.routers.${ENV}-backup-monitor-swarm-http.rule=Host(`backups.${INDUSTREAM_DOMAIN:-localhost}`)
        - traefik.http.routers.${ENV}-backup-monitor-swarm-http.entrypoints=web
        - traefik.http.routers.${ENV}-backup-monitor-swarm-http.middlewares=redirect-to-https@file

# =============================================================================
# NETWORKS
# =============================================================================
networks:
  traefik-public:
    external: true
    name: traefik-shared_traefik-public
  ${ENV}-platform:

# =============================================================================
# VOLUMES
# =============================================================================
volumes:
  ${ENV}-backup-data:
  ${ENV}-backup-verify-logs:
  # All source volumes below are created by other stacks; they are referenced
  # here as `external: true` so the backup stack can mount them read-only
  # without racing stack-deploy order.
  ${ENV}-grafana-data:
    external: true
  ${ENV}-minio-data:
    external: true
  ${ENV}-flowmaker-launcher-data:
    external: true
  ${ENV}-flowmaker-confighub-data:
    external: true
  ${ENV}-ntfy-data:
    external: true
  ${ENV}-alertmanager-data:
    external: true
  ${ENV}-cdn-server-storage:
    external: true
  ${ENV}-ironstream-postgres-data:
    external: true

# =============================================================================
# SECRETS
# =============================================================================
secrets:
  ${ENV}_postgres_admin_password:
    external: true
  ${ENV}_influx_admin_token:
    external: true
  # Used by backup-timescaledb (profile: ts-timescale). Only required when
  # TIMESERIES_BACKEND=timescale at deploy time.
  ${ENV}_timescaledb_password:
    external: true
  # Used by backup-offsite (profile: offsite). Only required when
  # OFFSITE_ENABLED=true at deploy time.
  ${ENV}_offsite_ssh_key:
    external: true

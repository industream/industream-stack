# =============================================================================
# INDUSTREAM PLATFORM - FLOWMAKER SERVICES (v2)
# =============================================================================
# FlowMaker core services: launcher, confighub-v2 (LMDB), logging, frontend
# Multi-environment support: Uses ${ENV} prefix for isolation
# =============================================================================

services:
  # ==========================================
  # FLOWMAKER LAUNCHER (v2 - replaces runtime)
  # ==========================================
  flowmaker-scheduler:
    image: ${COMMUNITY_REGISTRY:-ghcr.io/industream}/flowmaker.core/flowmaker-launcher:${FLOWMAKER_CORE_VERSION:-2.1.0}
    stop_grace_period: 30s
    environment:
    - FM_RUNTIME_BACKEND_PORT=3120
    - FM_WORKER_LOG_SOCKET_IO_ENDPOINT=http://flowmaker-logging:3000
    - FM_CONFIGHUB_URL=http://flowmaker-confighub:4000
    - FM_LAUNCHER_DATA_PATH=/data
    volumes:
    - ${ENV}-flowmaker-launcher-data:/data
    networks:
    - traefik-public
    - ${ENV}-platform
    depends_on:
    - flowmaker-confighub
    - flowmaker-logging
    healthcheck:
      test:
      - CMD-SHELL
      - bash -c '(echo > /dev/tcp/127.0.0.1/3120) 2>/dev/null' || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      labels:
      - traefik.enable=true
      - traefik.http.routers.${ENV}-flowmaker-scheduler-secure.entrypoints=websecure
      - traefik.http.routers.${ENV}-flowmaker-scheduler-secure.rule=Host(`scheduler.${INDUSTREAM_DOMAIN:-localhost}`)
      - traefik.http.routers.${ENV}-flowmaker-scheduler-secure.tls=true
      - traefik.http.routers.${ENV}-flowmaker-scheduler-secure.service=${ENV}-flowmaker-scheduler
      - traefik.http.routers.${ENV}-flowmaker-scheduler.entrypoints=web
      - traefik.http.routers.${ENV}-flowmaker-scheduler.rule=Host(`scheduler.${INDUSTREAM_DOMAIN:-localhost}`)
      - traefik.http.routers.${ENV}-flowmaker-scheduler.middlewares=redirect-to-https@file
      - traefik.http.services.${ENV}-flowmaker-scheduler.loadbalancer.server.port=3120
      resources:
        limits:
          cpus: '1.0'
          memory: 256M
        reservations:
          cpus: '0.08'
          memory: 128M
      restart_policy:
        condition: any
        delay: 5s
        max_attempts: 0
        window: 120s

  # ==========================================
  # FLOWMAKER CONFIGHUB v2 (LMDB-backed)
  # ==========================================
  flowmaker-confighub:
    image: ${COMMUNITY_REGISTRY:-ghcr.io/industream}/flowmaker.core/flowmaker-confighub-v2:${FLOWMAKER_CORE_VERSION:-2.1.0}
    environment:
    - FM_CONFIGHUB_PORT=4000
    - FM_CONFIGHUB_DATA_PATH=/data
    volumes:
    - ${ENV}-flowmaker-confighub-data:/data
    networks:
    - traefik-public
    - ${ENV}-platform
    healthcheck:
      test:
      - CMD-SHELL
      - bash -c '(echo > /dev/tcp/127.0.0.1/4000) 2>/dev/null' || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      labels:
      - traefik.enable=true
      - traefik.http.routers.${ENV}-flowmaker-confighub-secure.entrypoints=websecure
      - traefik.http.routers.${ENV}-flowmaker-confighub-secure.rule=Host(`confighub.${INDUSTREAM_DOMAIN:-localhost}`)
      - traefik.http.routers.${ENV}-flowmaker-confighub-secure.tls=true
      - traefik.http.routers.${ENV}-flowmaker-confighub-secure.service=${ENV}-flowmaker-confighub
      - traefik.http.routers.${ENV}-flowmaker-confighub-secure.middlewares=
      - traefik.http.routers.${ENV}-flowmaker-confighub.entrypoints=web
      - traefik.http.routers.${ENV}-flowmaker-confighub.rule=Host(`confighub.${INDUSTREAM_DOMAIN:-localhost}`)
      - traefik.http.routers.${ENV}-flowmaker-confighub.middlewares=redirect-to-https@file
      - traefik.http.services.${ENV}-flowmaker-confighub.loadbalancer.server.port=4000
      resources:
        limits:
          cpus: '0.5'
          memory: 128M
        reservations:
          cpus: '0.08'
          memory: 64M
      restart_policy:
        condition: any
        delay: 5s
        max_attempts: 0
        window: 120s

  # ==========================================
  # FLOWMAKER LOGGING
  # ==========================================
  flowmaker-logging:
    image: ${COMMUNITY_REGISTRY:-ghcr.io/industream}/flowmaker.core/flowmaker-logger:${FLOWMAKER_LOGGER_VERSION:-2.1.0}
    networks:
    - traefik-public
    - ${ENV}-platform
    healthcheck:
      test:
      - CMD-SHELL
      - bash -c '(echo > /dev/tcp/127.0.0.1/3000) 2>/dev/null' || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      labels:
      - traefik.enable=true
      - traefik.http.routers.${ENV}-flowmaker-logging-secure.entrypoints=websecure
      - traefik.http.routers.${ENV}-flowmaker-logging-secure.rule=Host(`logger.${INDUSTREAM_DOMAIN:-localhost}`)
      - traefik.http.routers.${ENV}-flowmaker-logging-secure.tls=true
      - traefik.http.routers.${ENV}-flowmaker-logging-secure.service=${ENV}-flowmaker-logging
      - traefik.http.routers.${ENV}-flowmaker-logging.entrypoints=web
      - traefik.http.routers.${ENV}-flowmaker-logging.rule=Host(`logger.${INDUSTREAM_DOMAIN:-localhost}`)
      - traefik.http.routers.${ENV}-flowmaker-logging.middlewares=redirect-to-https@file
      - traefik.http.services.${ENV}-flowmaker-logging.loadbalancer.server.port=3000
      resources:
        limits:
          cpus: '0.5'
          memory: 128M
        reservations:
          cpus: '0.08'
          memory: 64M
      restart_policy:
        condition: any
        delay: 5s
        max_attempts: 0
        window: 120s

  # ==========================================
  # FLOWMAKER FRONTEND
  # ==========================================
  flowmaker-frontend:
    image: ${COMMUNITY_REGISTRY:-ghcr.io/industream}/flowmaker.core/flowmaker-front:${FLOWMAKER_FRONTEND_VERSION:-2.1.0}
    environment:
    - FMUI_CONFIG_HUB_URL=https://confighub.${INDUSTREAM_DOMAIN:-localhost}
    # The SPA dynamically imports ${industreamHubOrigin}/industream-login.js
    # for the cross-subdomain auth-bridge. Default in assets/config.json is
    # a test-stub (hub.hub-test.flowmaker.testnet) baked into the image —
    # if left, the SPA crashes at bootstrap with ERR_NAME_NOT_RESOLVED.
    - FMUI_INDUSTREAM_HUB_ORIGIN=https://${INDUSTREAM_DOMAIN:-localhost}
    networks:
    - traefik-public
    - ${ENV}-platform
    depends_on:
    - flowmaker-confighub
    - flowmaker-scheduler
    healthcheck:
      test:
      - CMD-SHELL
      - wget -q --spider http://127.0.0.1:80/ || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      labels:
      - traefik.enable=true
      - traefik.http.routers.${ENV}-flowmaker-frontend-secure.entrypoints=websecure
      - traefik.http.routers.${ENV}-flowmaker-frontend-secure.rule=Host(`flowmaker.${INDUSTREAM_DOMAIN:-localhost}`)
      - traefik.http.routers.${ENV}-flowmaker-frontend-secure.tls=true
      - traefik.http.routers.${ENV}-flowmaker-frontend-secure.service=${ENV}-flowmaker-frontend
      - traefik.http.routers.${ENV}-flowmaker-frontend-secure.middlewares=
      - traefik.http.routers.${ENV}-flowmaker-frontend-secure.priority=1
      - traefik.http.routers.${ENV}-flowmaker-frontend.entrypoints=web
      - traefik.http.routers.${ENV}-flowmaker-frontend.rule=Host(`flowmaker.${INDUSTREAM_DOMAIN:-localhost}`)
      - traefik.http.routers.${ENV}-flowmaker-frontend.middlewares=redirect-to-https@file
      - traefik.http.routers.${ENV}-flowmaker-frontend.priority=1
      - traefik.http.middlewares.${ENV}-flowmaker-frontend-stripprefix.stripprefix.prefixes=/flowmaker
      - traefik.http.services.${ENV}-flowmaker-frontend.loadbalancer.server.port=80
      - traefik.http.middlewares.${ENV}-flowmaker-add-prefix.addprefix.prefix=/flowmaker
      resources:
        limits:
          cpus: '0.25'
          memory: 64M
        reservations:
          cpus: '0.03'
          memory: 32M
      restart_policy:
        condition: any
        delay: 5s
        max_attempts: 0
        window: 120s

# =============================================================================
# NETWORKS
# =============================================================================
networks:
  traefik-public:
    external: true
    name: traefik-shared_traefik-public
  ${ENV}-platform:

# =============================================================================
# VOLUMES
# =============================================================================
volumes:
  ${ENV}-flowmaker-launcher-data:
  ${ENV}-flowmaker-confighub-data:
